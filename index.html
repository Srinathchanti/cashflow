  </div>`;

  document.getElementById("splitwise-hub-inner").innerHTML = `
    <div class="modal-head">
      <h2 class="heading-md">Splitwise</h2>
      <button class="icon-btn" style="width:32px;height:32px" onclick="closeSplitwiseHub()">${icon("x",'style="width:15px;height:15px"')}</button>
    </div>
    <button class="btn-primary" style="margin-bottom:16px" onclick="toggleHubNewSplitForm()">${icon("plus",'style="width:13px;height:13px"')} New Split</button>
    ${hubNewSplitOpen ? `<div class="split-card" style="margin-bottom:16px">
      <input class="input" id="hub-new-desc" placeholder="What's this for? (e.g. Dinner, Trip to Tahoe)" style="margin-bottom:8px">
      <input class="input" id="hub-new-amount" type="number" step="0.01" min="0" placeholder="Total amount" style="margin-bottom:10px">
      <button class="btn-primary" onclick="submitHubNewSplit()">Continue to add friends</button>
    </div>` : ""}
    <p class="label" style="margin-bottom:8px">Needs settling</p>
    ${pending.length ? pending.map(splitRow).join("") : `<p class="caption" style="padding:8px 0 16px">Nothing pending — you're all settled up.</p>`}
    ${settledSplits.length ? `<p class="label" style="margin:16px 0 8px">Settled</p>${settledSplits.map(splitRow).join("")}` : ""}
    <p class="label" style="margin:20px 0 8px">Add a split</p>
    ${(unsplitTx.length + unsplitBills.length) === 0
      ? `<p class="caption" style="padding:8px 0">No recent expenses or bills to split yet.</p>`
      : [
          ...unsplitTx.map(t => addRow("tx", t.id, t.description || getCat(t.category,"expense").label, parseFloat(t.amount))),
          ...unsplitBills.map(b => addRow("bill", b.id, b.name, parseFloat(b.amount))),
        ].join("")}
  `;
  refreshIcons();
}

function renderStory() {
  const s = computeSummary({ date: state.date });

  const dayTxs = TXS.filter(t => t.date.slice(0,10) === state.date).sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt));
  const isToday = state.date === dayStr();

  const donutMode = state.donutMode;
  const donutCursor = state.donutCursor;
  let donutSummaryArg, donutPeriodLabel, donutCenterLabel, donutLossLabel;
  if (donutMode === "day") {
    const ds = dayStr(donutCursor);
    donutSummaryArg = { date: ds };
    donutPeriodLabel = ds === dayStr() ? "Today" : donutCursor.toLocaleDateString("en-US", { weekday:"short", month:"short", day:"numeric" });
    donutCenterLabel = "spent this day"; donutLossLabel = "today";
  } else if (donutMode === "week") {
    const wEnd = new Date(donutCursor);
    const wStart = new Date(donutCursor); wStart.setDate(wStart.getDate() - 6);
    donutSummaryArg = { start: dayStr(wStart), end: dayStr(wEnd) };
    donutPeriodLabel = dayStr(wEnd) === dayStr()
      ? "This week"
      : `${wStart.toLocaleDateString("en-US",{month:"short",day:"numeric"})} \u2013 ${wEnd.toLocaleDateString("en-US",{month:"short",day:"numeric"})}`;
    donutCenterLabel = "spent this week"; donutLossLabel = "this week";
  } else if (donutMode === "year") {
    donutSummaryArg = { year: String(donutCursor.getFullYear()) };
    donutPeriodLabel = String(donutCursor.getFullYear());
    donutCenterLabel = "spent this year"; donutLossLabel = "this year";
  } else if (donutMode === "all") {
    donutSummaryArg = {};
    donutPeriodLabel = "All time";
    donutCenterLabel = "spent all time"; donutLossLabel = "overall";
  } else {
    donutSummaryArg = { month: monthStr(donutCursor) };
    donutPeriodLabel = donutCursor.toLocaleDateString("en-US", { month:"long", year:"numeric" });
    donutCenterLabel = "spent this month"; donutLossLabel = "this month";

  const dms = computeSummary(donutSummaryArg);
  const donutSavings = dms.totalIncome - dms.totalExpense;
  const donutSlices = dms.expCats.sort((a,b) => b.total-a.total).map(c => { const cd = getCat(c.cat, "expense"); return { label: cd.label, color: cd.color, value: c.total }; });
  if (dms.totalIncome > 0 && donutSavings > 0) donutSlices.push({ label: "Savings", color: "var(--green)", value: donutSavings });
  const donutTotal = donutSlices.reduce((s,x) => s+x.value, 0);
  const donutModeBtn = (m, txt) => `<button class="pill${donutMode===m?" active":""}" style="padding:4px 10px;font-size:.6875rem" onclick="setDonutMode('${m}')">${txt}</button>`;
  let donutCard = `<div class="card chart-card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <p class="label">Category-Wise Expense & Savings</p>
      <div style="display:flex;gap:4px">${donutModeBtn("day","Day")}${donutModeBtn("week","Week")}${donutModeBtn("month","Month")}${donutModeBtn("year","Year")}${donutModeBtn("all","All time")}</div>
    </div>
    ${donutMode !== "all" ? `<div style="display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px">
      <button onclick="donutPrev()">${icon("chevron-left",'style="width:14px;height:14px;color:var(--text-3)"')}</button>
      <span style="font-size:.75rem;font-weight:700">${donutPeriodLabel}</span>
      <button onclick="donutNext()">${icon("chevron-right",'style="width:14px;height:14px;color:var(--text-3)"')}</button>
    </div>` : `<p class="caption" style="text-align:center;margin-bottom:14px">${donutPeriodLabel}</p>`}
    ${donutSlices.length > 0 ? `
    <div class="donut-wrap">
      ${buildDoughnutSVG(donutSlices, donutTotal)}
      <div class="donut-center">
        <div class="donut-center-value">${fmt(dms.totalExpense)}</div>
        <div class="donut-center-label">${donutCenterLabel}</div>
      </div>
    </div>
    <div class="donut-legend">
      ${donutSlices.map(sl => `<div class="donut-legend-row${sl.label==="Savings"?" savings-row":""}">
        <span class="dot" style="background:${sl.color}"></span>
        <span class="donut-legend-label">${esc(sl.label)}</span>
        <span class="donut-legend-pct">${donutTotal>0?(sl.value/donutTotal*100).toFixed(0):0}%</span>
        <span class="mono donut-legend-amt">${fmt(sl.value)}</span>
      </div>`).join("")}
    </div>
    ${dms.totalIncome > 0 && donutSavings <= 0 ? `<p class="caption" style="text-align:center;margin-top:12px;color:var(--red)">You've spent ${fmt(Math.abs(donutSavings))} more than you've earned ${donutLossLabel}.</p>` : ""}
    ` : `<p class="body-sm" style="text-align:center;padding:28px 0;color:var(--text-3)">No transactions for this ${donutMode==="all"?"period":donutMode}.</p>`}
  </div>`;

  let catHtml = "";
  if (s.expCats.length > 0) {
    catHtml = `<div class="card insights-card">
      <p class="label" style="margin-bottom:14px">Spending Breakdown</p>
      ${s.expCats.sort((a,b)=>b.total-a.total).map(c => {
        const cat = getCat(c.cat, "expense");
        const pct = s.totalExpense > 0 ? (c.total/s.totalExpense*100) : 0;
        return `<div class="cat-item">
          <div class="cat-row">
            <span style="display:flex;align-items:center;font-weight:600"><span class="cat-icon" style="background:${cat.soft}">${icon(cat.icon,'style="width:13px;height:13px;color:'+cat.color+'"')}</span>${esc(cat.label)}</span>
            <span class="mono" style="font-weight:700">${fmt(c.total)}</span>
          </div>
          <div class="track" style="height:6px"><div style="height:100%;border-radius:999px;background:${cat.color};width:${pct}%"></div></div>
        </div>`;
      }).join("")}
    </div>`;
  }

  return `
  <div class="date-nav">
    <button class="icon-btn" onclick="storyPrev()">${icon("chevron-left")}</button>
    <div class="date-center">
      <div class="date-main">${prettyDate(state.date)}</div>
      <div class="date-sub">${new Date(state.date+"T12:00:00").toLocaleDateString("en-US",{month:"long",year:"numeric"})}</div>
    </div>
    <button class="icon-btn" ${isToday?"disabled style='opacity:.2'":""} onclick="storyNext()">${icon("chevron-right")}</button>
  </div>

  <div class="card hero-card">
    <div class="hero-glow"></div>
    <div style="position:relative;z-index:1">
      <p class="label" style="margin-bottom:8px">Net Balance Today</p>
      <div class="hero-net" style="color:${s.net>=0?"var(--green)":"var(--red)"}">${fmt(s.net)}</div>
      <div class="hero-split">
        <div><div style="display:flex;align-items:center;margin-bottom:4px"><span class="dot" style="background:var(--green)"></span><span class="caption">Earned</span></div><div style="font-weight:700;color:var(--green)">${fmt(s.totalIncome)}</div></div>
        <div><div style="display:flex;align-items:center;margin-bottom:4px"><span class="dot" style="background:var(--red)"></span><span class="caption">Spent</span></div><div style="font-weight:700;color:var(--red)">${fmt(s.totalExpense)}</div></div>
      </div>
    </div>
  </div>

  <div class="card insights-card">
    <p class="label" style="margin-bottom:10px;display:flex;align-items:center;gap:6px">${icon("sparkles",'style="width:12px;height:12px"')} Your Story</p>
    ${ins.insights.map(i => `<div class="insight-row">${esc(i)}</div>`).join("")}
  </div>

  ${donutCard}

  ${catHtml}

  <div class="section-head">
    <p class="label">Transactions</p>
    <span class="count-badge">${dayTxs.length}</span>
  </div>
  ${dayTxs.length === 0
    ? `<div class="card empty-state">${icon("wallet")}<p class="heading-md" style="margin-bottom:4px">No transactions yet</p><p class="body-sm">Tap <strong>+</strong> to log your first earning or expense</p></div>`
    : dayTxs.map(txRowHtml).join("") + `<p class="caption" style="text-align:center;padding-top:8px">Tap the trash icon to delete</p>`}
  `;
}

function renderCalendar() {
  const cur = state.calCursor;
  const ms = monthStr(cur);
  const days = computeCalendarDays(ms);
  const y = cur.getFullYear(), m = cur.getMonth();
  const first = new Date(y,m,1).getDay();
  const dim = new Date(y,m+1,0).getDate();
  const todayS = dayStr();

  let cells = "";
  for (let i=0;i<first;i++) cells += `<div></div>`;
  for (let dn=1;dn<=dim;dn++) {
    const ds = `${y}-${String(m+1).padStart(2,"0")}-${String(dn).padStart(2,"0")}`;
    const d = days[ds];
    const isT = ds === todayS;
    const net = d ? d.income-d.expense : 0;
    cells += `<button class="cal-day" style="background:${d?(net>=0?"var(--green-soft)":"var(--red-soft)"):"transparent"};border-color:${isT?"var(--blue)":"transparent"}" onclick="calSelect('${ds}')">
      <span class="dn" style="color:${isT?"var(--blue)":"var(--text-1)"}">${dn}</span>
      ${d ? `<div>${d.income>0?`<div class="cal-amt" style="color:var(--green)">+${fmtCompact(d.income)}</div>`:""}${d.expense>0?`<div class="cal-amt" style="color:var(--red)">-${fmtCompact(d.expense)}</div>`:""}</div>` : ""}
    </button>`;
  }

  return `
  <div class="date-nav">
    <button class="icon-btn" onclick="calPrev()">${icon("chevron-left")}</button>
    <span style="font-weight:700;font-size:.875rem">${cur.toLocaleDateString("en-US",{month:"long",year:"numeric"})}</span>
    <button class="icon-btn" onclick="calNext()">${icon("chevron-right")}</button>
  </div>
  <div class="card" style="padding:16px">
    <div class="cal-grid" style="margin-bottom:8px">${["S","M","T","W","T","F","S"].map(d=>`<div class="cal-head">${d}</div>`).join("")}</div>
    <div class="cal-grid">${cells}</div>
  </div>`;
}

function calNext() { const d = new Date(state.calCursor); d.setMonth(d.getMonth()+1); state.calCursor = d; renderMain(); }

function budPrev() { const d = new Date(state.budCursor); d.setMonth(d.getMonth()-1); state.budCursor = d; renderMain(); }
function budNext() { const d = new Date(state.budCursor); d.setMonth(d.getMonth()+1); state.budCursor = d; renderMain(); }

function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (r) => {
    const rows = [];
    let skipped = 0;
    r.data.forEach(row => {
      const t = (row.type||"").toLowerCase().trim();
      const a = parseFloat(row.amount);
      const c = (row.category||"").toLowerCase().trim();
      if ((t!=="income" && t!=="expense") || isNaN(a) || a<=0 || !c) { skipped++; return; }
      rows.push({ type:t, amount:a, category:c, description:row.description||"", notes:row.notes||"", currency:row.currency||"USD", date: row.date ? new Date(row.date).toISOString() : new Date().toISOString(), is_recurring:false, recurring_id:null });
    });
    e.target.value = "";
    if (!rows.length) { alert(`Imported 0, skipped ${skipped}`); return; }
    const { data, error } = await sb.from("transactions").insert(rows).select();
    if (error) { alert("Import failed: " + error.message); return; }
    TXS = data.map(mapTx).concat(TXS);
    alert(`Imported ${data.length}, skipped ${skipped}`);
    renderMain();
  }});
}

function calcSplitAmounts(total, sp) {
  total = Math.round((total || 0) * 100) / 100;
  const friends = FRIENDS.filter(f => sp.friendIds.includes(f.id));
  const participants = (sp.enabled !== false) ? [{ id:"you", name:"You", isPayer:true }, ...friends.map(f => ({ id:f.id, name:f.name, isPayer:false, color:f.avatarColor }))] : [];
  const n = participants.length;
  let amounts = {};
  if (n > 0) {
    if (sp.mode === "equal") {
      const totalCents = Math.round(total * 100);
      const base = Math.floor(totalCents / n);
      const leftover = totalCents - base * n;
      participants.forEach((p, i) => { amounts[p.id] = (base + (i < leftover ? 1 : 0)) / 100; });
    } else {
      participants.forEach(p => { amounts[p.id] = parseFloat(sp.exact[p.id]) || 0; });
    }
  }
  const allocated = Math.round(Object.values(amounts).reduce((s,v) => s+v, 0) * 100) / 100;
  const remaining = Math.round((total - allocated) * 100) / 100;
  const isBalanced = sp.mode === "equal" || Math.abs(remaining) < 0.01;
  return { total, participants, amounts, remaining, isBalanced };
}
function computeSplitCalc() {
  const total = parseFloat(document.getElementById("tx-amount").value) || 0;
  return calcSplitAmounts(total, modalState.split);
}

      </div>` : ""}
      <div class="split-mode-tabs">
        <button class="split-mode-tab${sp.mode==="equal"?" active":""}" onclick="setSplitMode('equal')">Split Equally</button>
        <button class="split-mode-tab${sp.mode==="exact"?" active":""}" onclick="setSplitMode('exact')">Split Exactly</button>
      </div>`;
    if (calc.participants.length > 1) {
      html += calc.participants.map(p => `<div class="split-participant-row">
        <span style="font-size:.75rem">${esc(p.name)}${p.isPayer?' <span style="color:var(--text-4);font-size:.625rem">(paid)</span>':""}</span>
        ${sp.mode === "equal"
          ? `<span class="mono" style="font-size:.75rem">${fmt(calc.amounts[p.id]||0)}</span>`
          : `<input type="number" step="0.01" min="0" class="split-exact-input" value="${sp.exact[p.id] ?? (calc.amounts[p.id]||0).toFixed(2)}" oninput="setSplitExactAmount('${p.id}', this.value)">`
        }
      </div>`).join("");
      if (sp.mode === "exact") {
        const bal = calc.isBalanced;
        html += `<div class="split-balance-banner" id="split-balance-banner" style="background:${bal?"var(--green-soft)":"var(--red-soft)"};color:${bal?"var(--green)":"var(--red)"}">
          <span>${bal ? "Amounts match the total" : (calc.remaining>0 ? "Remaining to allocate" : "Over the total by")}</span>
          ${bal?"":`<span class="mono">${fmt(Math.abs(calc.remaining))}</span>`}
        </div>`;
      }
    } else {
      html += `<p class="caption" style="text-align:center;padding:14px 0">Pick at least one friend to split with.</p>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  refreshIcons();
}
function toggleSplitEnabled() { modalState.split.enabled = !modalState.split.enabled; renderSplitSection(); }
function toggleSplitFriend(id) {
  const sp = modalState.split;
  sp.friendIds = sp.friendIds.includes(id) ? sp.friendIds.filter(x => x !== id) : [...sp.friendIds, id];
  delete sp.exact[id];
  renderSplitSection();
}
function setSplitMode(mode) {
  const sp = modalState.split;
  if (mode === "exact") { const calc = computeSplitCalc(); calc.participants.forEach(p => { if (sp.exact[p.id] === undefined) sp.exact[p.id] = (calc.amounts[p.id]||0).toFixed(2); }); }
  sp.mode = mode; renderSplitSection();
}
function setSplitExactAmount(id, value) {
  modalState.split.exact[id] = value;
  const calc = computeSplitCalc();
  const banner = document.getElementById("split-balance-banner");
  if (!banner) return;
  const bal = calc.isBalanced;
  banner.style.background = bal ? "var(--green-soft)" : "var(--red-soft)";
  banner.style.color = bal ? "var(--green)" : "var(--red)";
  banner.innerHTML = `<span>${bal ? "Amounts match the total" : (calc.remaining>0 ? "Remaining to allocate" : "Over the total by")}</span>${bal?"":`<span class="mono">${fmt(Math.abs(calc.remaining))}</span>`}`;
}
function toggleAddFriendInput() { modalState.split.addingFriend = !modalState.split.addingFriend; renderSplitSection(); if (modalState.split.addingFriend) setTimeout(() => document.getElementById("new-friend-name")?.focus(), 0); }
async function submitNewFriend() {
  const nameInput = document.getElementById("new-friend-name");
  const emailInput = document.getElementById("new-friend-email");
  const name = nameInput.value.trim(); if (!name) return;
  const f = await addFriend(name, emailInput.value.trim());
  if (f) { modalState.split.friendIds.push(f.id); modalState.split.addingFriend = false; renderSplitSection(); }
}

function fillCurrencySelect() { document.getElementById("tx-currency").innerHTML = CURRENCIES.map(c => `<option value="${c.code}">${c.code}</option>`).join(""); }

function fillCategoryGrid() {
  const cats = modalState.type === "income" ? INCOME_CATS : EXPENSE_CATS;
  document.getElementById("cat-grid").innerHTML = cats.map(c => {
    const selected = modalState.category === c.key;
    return `<button class="cat-btn" style="${selected?`background:${c.soft};color:${c.color};border-color:${c.color}`:""}" onclick="modalSelectCategory('${c.key}')">
      <span class="cat-btn-icon" style="background:${c.soft}">${icon(c.icon,'style="color:'+c.color+'"')}${selected?`<span class="cat-check" style="background:${c.color}">${icon("check")}</span>`:""}</span>
      ${c.label.split(" ")[0]}
    </button>`;
  }).join("");
  refreshIcons();
  updateSubmitState();
}
function modalSetType(type) {
  modalState.type = type; modalState.category = ""; modalState.paymentMethod = { mode:null, custom:"" };
  document.getElementById("type-expense").className = "type-btn" + (type==="expense" ? " active-expense" : "");
  document.getElementById("type-income").className = "type-btn" + (type==="income" ? " active-income" : "");
  document.getElementById("tx-submit").textContent = type === "income" ? "Add Income" : "Add Expense";
  fillCategoryGrid();
  renderPaymentMethodSection();
  renderSplitSection();
}
function isOtherCategory(key) { return key === "other_expense" || key === "other_income"; }
function modalSelectCategory(key) {
  modalState.category = key;
  if (!isOtherCategory(key)) modalState.paymentMethod = { mode:null, custom:"" };
  fillCategoryGrid();
  renderPaymentMethodSection();
}
function renderPaymentMethodSection() {
  const el = document.getElementById("payment-method-section");
  if (!el) return;
  if (!isOtherCategory(modalState.category)) { el.innerHTML = ""; return; }
  const pm = modalState.paymentMethod;
  const btn = (mode, label) => `<button type="button" class="pill${pm.mode===mode?" active":""}" onclick="setPaymentMethodMode('${mode}')">${esc(label)}</button>`;
  el.innerHTML = `
    <p class="label" style="margin-bottom:8px">Payment method</p>
    <div style="display:flex;gap:6px;margin-bottom:${pm.mode==="custom"?"8px":"12px"}">
      ${btn("cash","Cash")}${btn("online","Online")}${btn("custom","Other")}
    </div>
    ${pm.mode==="custom" ? `<input class="input" id="payment-custom-input" placeholder="e.g. Cheque, Barter..." value="${esc(pm.custom)}" oninput="modalState.paymentMethod.custom=this.value;updateSubmitState();" style="margin-bottom:12px">` : ""}
  `;
  refreshIcons();
  updateSubmitState();
}
function setPaymentMethodMode(mode) { modalState.paymentMethod.mode = mode; renderPaymentMethodSection(); }
function modalToggleNotes() {
  modalState.extra = !modalState.extra;
  document.getElementById("notes-area").classList.toggle("open", modalState.extra);
  document.getElementById("notes-toggle-label").textContent = modalState.extra ? "Hide" : "Add";
}
function paymentMethodValid() {
  if (!isOtherCategory(modalState.category)) return true;
  const pm = modalState.paymentMethod;
  if (!pm.mode) return false;
  if (pm.mode === "custom" && !pm.custom.trim()) return false;
  return true;
}
function resolvedPaymentMethod() {
  const pm = modalState.paymentMethod;
  if (pm.mode === "cash") return "Cash";
  if (pm.mode === "online") return "Online";
  if (pm.mode === "custom") return pm.custom.trim();
  return null;
}
function updateSubmitState() {
  const amt = document.getElementById("tx-amount").value;
  document.getElementById("tx-submit").disabled = !amt || !modalState.category || !paymentMethodValid();
}
function openModal() {
  modalState.type = "expense"; modalState.category = ""; modalState.extra = false;
  modalState.split = { enabled:false, mode:"equal", friendIds:[], exact:{}, addingFriend:false };
  modalState.paymentMethod = { mode:null, custom:"" };
  document.getElementById("tx-amount").value = ""; document.getElementById("tx-desc").value = ""; document.getElementById("tx-notes").value = "";
  document.getElementById("notes-area").classList.remove("open"); document.getElementById("notes-toggle-label").textContent = "Add";
  fillCurrencySelect(); modalSetType("expense");
  document.getElementById("modal-overlay").classList.add("open");
  document.getElementById("modal-box").classList.add("open");
}
function closeModal() { document.getElementById("modal-overlay").classList.remove("open"); document.getElementById("modal-box").classList.remove("open"); }
async function modalSubmit() {
  const amount = document.getElementById("tx-amount").value, category = modalState.category;
  if (!amount || !category) return;
  if (!paymentMethodValid()) { alert("Pick a payment method first."); return; }
  const sp = modalState.split;
  const calc = computeSplitCalc();
  const splitReady = sp.enabled && calc.participants.length > 1 && calc.isBalanced;
  if (sp.enabled && calc.participants.length > 1 && !calc.isBalanced) { alert("Split amounts don't add up to the total yet."); return; }
  const btn = document.getElementById("tx-submit");
  btn.disabled = true; const orig = btn.innerHTML; btn.innerHTML = '<div class="spinner"></div>';
  const txRow = await addTransaction({ type: modalState.type, amount, category, description: document.getElementById("tx-desc").value, currency: document.getElementById("tx-currency").value, notes: document.getElementById("tx-notes").value, date: new Date(state.date+"T12:00:00").toISOString(), paymentMethod: resolvedPaymentMethod() });
  if (txRow && splitReady) {
    await saveSplitForTransaction(txRow.id, {
      mode: sp.mode, totalAmount: calc.total,
      participants: calc.participants.map(p => ({ friendId: p.isPayer ? null : p.id, isPayer: p.isPayer, displayName: p.name, amountOwed: calc.amounts[p.id]||0, status: p.isPayer ? "settled" : "pending" })),
    });
  }
  closeModal(); btn.innerHTML = orig; renderMain();
}
document.addEventListener("input", (e) => { if (e.target && e.target.id === "tx-amount") { updateSubmitState(); renderSplitSection(); } });

/* ══════════════════════════════════════════════
   THEME
   ══════════════════════════════════════════════ */
function applyTheme() {
  document.documentElement.classList.toggle("dark", THEME === "dark");
  const btn = document.getElementById("theme-btn");
  if (btn) btn.innerHTML = icon(THEME === "dark" ? "sun" : "moon");
  refreshIcons();
}
function toggleTheme() { THEME = THEME === "dark" ? "light" : "dark"; Store.set("theme", THEME); applyTheme(); }

/* ══════════════════════════════════════════════
   INIT
   ══════════════════════════════════════════════ */
/* ══════════════════════════════════════════════
   AUTH
   ══════════════════════════════════════════════ */
let authMode = "signin"; // signin | signup | forgot | reset

function renderAuthScreen() {
  const card = document.getElementById("auth-card");
  const brand = `<div class="brand" style="justify-content:center;margin-bottom:22px">
      <div class="brand-icon">${icon("activity")}</div>
      <div><div class="brand-name">CashFlow</div><div class="brand-sub">Finance</div></div>
    </div>`;
  const msgs = `<p id="auth-error" style="color:var(--red);font-size:.75rem;margin-bottom:10px;display:none"></p>
    <p id="auth-info" style="color:var(--text-3);font-size:.75rem;margin-bottom:10px;display:none"></p>`;
  const linkBtnStyle = "background:none;border:none;padding:0;font-size:.75rem;color:var(--text-3);text-decoration:underline;cursor:pointer";
  let body;
  if (authMode === "reset") {
    body = `
      <p style="font-size:.8125rem;color:var(--text-2);margin-bottom:16px;text-align:center">Choose a new password for your account.</p>
      <form onsubmit="submitReset(); return false;">
        <input class="input" id="auth-password" type="password" autocomplete="new-password" placeholder="New password" style="margin-bottom:10px">
        <input class="input" id="auth-password2" type="password" autocomplete="new-password" placeholder="Confirm new password" style="margin-bottom:10px">
        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">Update Password</button>
      </form>`;
  } else if (authMode === "forgot") {
    body = `
      <p style="font-size:.8125rem;color:var(--text-2);margin-bottom:16px;text-align:center">Enter your email and we'll send a reset link.</p>
      <form onsubmit="submitForgot(); return false;">
        <input class="input" id="auth-email" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:10px">
        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">Send Reset Link</button>
      </form>
      <button style="${linkBtnStyle};display:block;margin:14px auto 0" onclick="setAuthMode('signin')">Back to sign in</button>`;
  } else {
    body = `
      <div class="manage-tabs" style="margin-bottom:16px">
        <button class="pill ${authMode==="signin"?"active":""}" onclick="setAuthMode('signin')" style="flex:1;justify-content:center">Sign In</button>
        <button class="pill ${authMode==="signup"?"active":""}" onclick="setAuthMode('signup')" style="flex:1;justify-content:center">Sign Up</button>
      </div>
      <form onsubmit="submitAuth(); return false;">
        <input class="input" id="auth-email" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:10px">
        <input class="input" id="auth-password" type="password" autocomplete="${authMode==="signin"?"current-password":"new-password"}" placeholder="Password" style="margin-bottom:8px">
        <div style="text-align:right;margin-bottom:10px;min-height:14px">${authMode==="signin"?`<button type="button" style="${linkBtnStyle}" onclick="setAuthMode('forgot')">Forgot password?</button>`:""}</div>
        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">${authMode==="signin"?"Sign In":"Create Account"}</button>
      </form>`;
  }
  card.innerHTML = brand + body;
  refreshIcons();
}
function setAuthMode(mode) { authMode = mode; renderAuthScreen(); }
function hideAuthMsgs() {
  const e1 = document.getElementById("auth-error"), e2 = document.getElementById("auth-info");
  if (e1) e1.style.display = "none";
  if (e2) e2.style.display = "none";
}
function showAuthError(msg) { hideAuthMsgs(); const el = document.getElementById("auth-error"); el.textContent = msg; el.style.display = "block"; }
function showAuthInfo(msg) { hideAuthMsgs(); const el = document.getElementById("auth-info"); el.textContent = msg; el.style.display = "block"; }

async function submitAuth() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  hideAuthMsgs();
  if (!email || !password) { showAuthError("Enter both email and password."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session === null) { showAuthInfo("Account created — check your email to confirm before signing in."); btn.disabled = false; btn.textContent = orig; return; }
    }
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
    btn.disabled = false; btn.textContent = orig;
  }
}
async function submitForgot() {
  const email = document.getElementById("auth-email").value.trim();
  hideAuthMsgs();
  if (!email) { showAuthError("Enter your email."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0] });
    if (error) throw error;
    showAuthInfo("Check your email for a password reset link.");
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
async function submitReset() {
  const pw = document.getElementById("auth-password").value;
  const pw2 = document.getElementById("auth-password2").value;
  hideAuthMsgs();
  if (!pw || pw.length < 6) { showAuthError("Password must be at least 6 characters."); return; }
  if (pw !== pw2) { showAuthError("Passwords don't match."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;
    showAuthInfo("Password updated — signing you in...");
    setTimeout(() => { authMode = "signin"; hideAuthScreen(); bootApp(); }, 1000);
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
    btn.disabled = false; btn.textContent = orig;
  }
}
async function handleSignOut() { await sb.auth.signOut(); }

function showAuthScreen() { document.getElementById("auth-screen").style.display = "flex"; }
function hideAuthScreen() { document.getElementById("auth-screen").style.display = "none"; }

async function bootApp() {
  document.getElementById("main-content").innerHTML = `
    <div class="skeleton" style="height:120px;margin-bottom:20px"></div>
    <div class="skeleton" style="height:180px;margin-bottom:20px"></div>
    <div class="skeleton" style="height:220px"></div>`;
  try {
    await loadAllFromSupabase();
  } catch (err) {
    console.error(err);
    document.getElementById("main-content").innerHTML = `<div class="card empty-state">${icon("cloud-off")}<p class="heading-md" style="margin-bottom:4px">Can't reach the database</p><p class="body-sm">Check your connection and reload.</p></div>`;
    refreshIcons();
    return;
  }
  renderMain();
  refreshIcons();
}

async function startApp() {
  applyTheme();
  refreshIcons();
  renderAuthScreen();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      authMode = "reset"; renderAuthScreen(); showAuthScreen();
    } else if (event === "SIGNED_IN" || event === "INITIAL_SESSION") {
      if (session) {
        if (authMode !== "reset") { hideAuthScreen(); bootApp(); }
      } else {
        authMode = "signin"; renderAuthScreen(); showAuthScreen();
      }
    } else if (event === "SIGNED_OUT") {
      authMode = "signin"; renderAuthScreen(); showAuthScreen();
      document.getElementById("main-content").innerHTML = "";
      TXS = []; BUDGETS = []; GOALS = []; BILLS = []; RECURRING = [];
    }
  });
}

function init() { startApp(); }
init();
</script>
</body>
</html>
