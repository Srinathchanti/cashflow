/* ── Record Payment (quick, for a due person; and "other", for anyone) ── */
let paymentModalState = null;
function openQuickPayment(personId) {
  if (!PEOPLE.find(p => p.id === personId)) return;
  paymentModalState = { mode:"quick", personId, showMore:false };
  renderPaymentModal();
  document.getElementById("payment-overlay").classList.add("open");
  document.getElementById("payment-box").classList.add("open");
}
function openOtherPaymentModal() {
  paymentModalState = { mode:"other", personId:null, creatingNew:false };
  renderPaymentModal();
  document.getElementById("payment-overlay").classList.add("open");
  document.getElementById("payment-box").classList.add("open");
}
function closePaymentModal() {
  document.getElementById("payment-overlay").classList.remove("open");
  document.getElementById("payment-box").classList.remove("open");
  paymentModalState = null;
}
function renderPaymentModal() {
  const st = paymentModalState;
  let html;
  if (st.mode === "quick") {
    const person = PEOPLE.find(p => p.id === st.personId);
    if (!person) { closePaymentModal(); return; }
    html = `
      <div class="modal-head">
        <h2 class="heading-md">${esc(person.name)}</h2>
        <button class="icon-btn" style="width:32px;height:32px" onclick="closePaymentModal()">${icon("x",'style="width:15px;height:15px"')}</button>
      </div>
      <p class="caption" style="margin-bottom:14px">Expected ${fmt(parseFloat(person.expectedAmount)||0)}</p>
      <p class="label" style="margin-bottom:6px">Amount received</p>
      <input class="input" id="pay-amount" type="number" step="0.01" min="0" value="${parseFloat(person.expectedAmount)||0}" style="margin-bottom:14px">
      ${st.showMore ? `<p class="label" style="margin-bottom:6px">Notes</p><input class="input" id="pay-notes" placeholder="Optional" style="margin-bottom:14px">`
        : `<button type="button" style="background:none;border:none;padding:0;font-size:.75rem;color:var(--text-3);text-decoration:underline;cursor:pointer;margin-bottom:14px" onclick="paymentModalState.showMore=true;renderPaymentModal();">More options</button>`}
      <button class="btn-primary" onclick="submitQuickPayment()">${icon("check",'style="width:14px;height:14px"')} Record payment</button>
    `;
  } else {
    const selectedPerson = st.personId ? PEOPLE.find(p => p.id === st.personId) : null;
    html = `
      <div class="modal-head">
        <h2 class="heading-md">Record payment</h2>
        <button class="icon-btn" style="width:32px;height:32px" onclick="closePaymentModal()">${icon("x",'style="width:15px;height:15px"')}</button>
      </div>
      <p class="label" style="margin-bottom:6px">Person</p>
      ${selectedPerson ? `<div class="split-participant-row" style="margin-bottom:14px">
          <span style="font-size:.8125rem;font-weight:700">${esc(selectedPerson.name)}</span>
          <button class="pill" style="padding:3px 10px;font-size:.625rem" onclick="paymentModalState.personId=null;renderPaymentModal();">Change</button>
        </div>`
      : st.creatingNew ? `<input class="input" id="pay-new-name" placeholder="New person's name" style="margin-bottom:14px">`
      : `<input class="input" id="pay-person-search" placeholder="Search people..." oninput="filterPaymentPersonList(this.value)" style="margin-bottom:8px">
        <div id="pay-person-list" style="max-height:140px;overflow-y:auto;margin-bottom:14px">${paymentPersonListHtml("")}</div>
        <button type="button" class="pill" style="margin-bottom:14px" onclick="paymentModalState.creatingNew=true;renderPaymentModal();">${icon("plus",'style="width:11px;height:11px"')} Create new person</button>`}
      <p class="label" style="margin-bottom:6px">Amount</p>
      <input class="input" id="pay-amount" type="number" step="0.01" min="0" placeholder="0.00" style="margin-bottom:14px">
      <p class="label" style="margin-bottom:6px">Date</p>
      <input class="input" id="pay-date" type="date" value="${dayStr()}" style="margin-bottom:14px">
      <p class="label" style="margin-bottom:6px">Notes</p>
      <input class="input" id="pay-notes" placeholder="Optional" style="margin-bottom:18px">
      <button class="btn-primary" onclick="submitOtherPayment()">${icon("check",'style="width:14px;height:14px"')} Record payment</button>
    `;
  }
  document.getElementById("payment-inner").innerHTML = html;
  refreshIcons();
}
function paymentPersonListHtml(q) {
  const query = q.toLowerCase();
  const matches = PEOPLE.filter(p => p.active && p.name.toLowerCase().includes(query)).slice(0, 6);
  if (!matches.length) return `<p class="caption" style="padding:6px 0">No matches.</p>`;
  return matches.map(p => `<div class="split-participant-row" style="cursor:pointer" onclick="paymentModalState.personId=${p.id};renderPaymentModal();">
    <span style="font-size:.75rem">${esc(p.name)}</span>
    ${icon("chevron-right",'style="width:13px;height:13px;color:var(--text-4)"')}
  </div>`).join("");
}
function filterPaymentPersonList(q) { const el = document.getElementById("pay-person-list"); if (el) el.innerHTML = paymentPersonListHtml(q); }
async function submitQuickPayment() {
  const person = PEOPLE.find(p => p.id === paymentModalState.personId);
  const amount = parseFloat(document.getElementById("pay-amount").value);
  if (!amount || amount <= 0) { alert("Enter an amount."); return; }
  const notesEl = document.getElementById("pay-notes");
  const saved = await addTransaction({ type:"income", amount, category:"people_payment", description: person.name, notes: notesEl?notesEl.value:"", currency:"USD", date: new Date(dayStr()+"T12:00:00").toISOString(), personId: person.id });
  if (!saved) return;
  closePaymentModal();
  renderMain();
}
async function submitOtherPayment() {
  const st = paymentModalState;
  let personId = st.personId, personName = "";
  if (!personId) {
    if (st.creatingNew) {
      const name = document.getElementById("pay-new-name").value.trim();
      if (!name) { alert("Enter a name."); return; }
      const p = await addPerson({ name, expectedAmount:null, frequency:null, startDate:null, notes:"" });
      if (!p) return;
      personId = p.id; personName = p.name;
    } else { alert("Pick or create a person first."); return; }
  } else {
    personName = PEOPLE.find(p => p.id === personId)?.name || "";
  }
  const amount = parseFloat(document.getElementById("pay-amount").value);
  if (!amount || amount <= 0) { alert("Enter an amount."); return; }
  const date = document.getElementById("pay-date").value;
  const notes = document.getElementById("pay-notes").value;
  if (!date) { alert("Choose a payment date."); return; }
  const saved = await addTransaction({ type:"income", amount, category:"people_payment", description: personName, notes, currency:"USD", date: new Date(date+"T12:00:00").toISOString(), personId });
  if (!saved) return;
  closePaymentModal();
  renderMain();
}

/* ── Person History ── */
function openPersonHistory(personId) {
  renderPersonHistory(personId);
  document.getElementById("person-history-overlay").classList.add("open");
  document.getElementById("person-history-box").classList.add("open");
}
function closePersonHistory() {
  document.getElementById("person-history-overlay").classList.remove("open");
  document.getElementById("person-history-box").classList.remove("open");
}
function renderPersonHistory(personId){const person=PEOPLE.find(p=>String(p.id)===String(personId));if(!person)return;const work=cwEntries(personId).sort((a,b)=>b.work_date.localeCompare(a.work_date)),pay=cwPayments(personId).sort((a,b)=>b.date.localeCompare(a.date)),earned=cwTotal(work,'amount'),received=cwTotal(pay,'amount');const rows=[...work.map(w=>({date:w.work_date,type:'Earned',amount:w.amount,notes:w.notes})),...pay.map(t=>({date:t.date.slice(0,10),type:'Received',amount:t.amount,notes:t.notes}))].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('person-history-inner').innerHTML=`<div class="modal-head"><h2 class="heading-md">${esc(person.name)}</h2><button class="icon-btn" onclick="closePersonHistory()">${icon('x')}</button></div><div class="grid-2" style="margin-bottom:14px"><div class="card-flat" style="padding:12px"><div class="caption">Total earned</div><strong>${cwMoney(earned)}</strong></div><div class="card-flat" style="padding:12px"><div class="caption">Total received</div><strong style="color:var(--green)">${cwMoney(received)}</strong></div></div><div class="card-flat" style="padding:12px;margin-bottom:16px"><div class="caption">${earned>=received?'Outstanding':'Client credit'}</div><strong>${cwMoney(Math.abs(earned-received))}</strong></div>${rows.length?rows.map(r=>`<div class="split-participant-row"><div style="flex:1"><strong style="font-size:.75rem">${r.type}</strong><div class="caption">${cwDate(r.date)}${r.notes?' · '+esc(r.notes):''}</div></div><strong class="mono" style="font-size:.75rem;color:${r.type==='Received'?'var(--green)':'var(--text-1)'}">${cwMoney(r.amount)}</strong></div>`).join(''):'<p class="body-sm">No activity recorded yet.</p>'}<button class="btn-primary" style="margin-top:14px" onclick="closePersonHistory()">Done</button>`;refreshIcons();}

function switchTab(tab) {
  if (tab === "manage") tab = "story";
  state.tab = tab;
  document.querySelectorAll(".nav-btn").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  const bar = document.getElementById("chat-bar");
  if (bar) bar.classList.toggle("open", tab === "ask");
  renderMain();
  if (tab === "ask") buildChatSuggestions();
  window.scrollTo({ top:0, behavior:"smooth" });
}
function renderMain() {
  const el = document.getElementById("main-content");
  if (state.tab === "work") el.innerHTML = dhootWorkView();
   else if (state.tab === "story") el.innerHTML = renderDashboard();
  else if (state.tab === "calendar") el.innerHTML = renderCalendar();
  else if (state.tab === "timeline") el.innerHTML = renderMoneyTimeline();
  else if (state.tab === "tools") el.innerHTML = renderTools();
  else if (state.tab === "ask") el.innerHTML = renderAsk();
  else if (state.tab === "people") el.innerHTML = renderPeople();
  if(cf21LoadWarnings.length){
    el.insertAdjacentHTML('afterbegin',`<div class="card" role="alert" style="padding:14px;border-color:var(--red);margin-bottom:15px"><strong style="color:var(--red)">Some records could not load</strong><p class="body-sm" style="margin:7px 0">${cf21LoadWarnings.map(x=>esc(x)).join('<br>')}</p><p class="caption">These tables may need installing. Open Work → Copy complete setup SQL, run it in Supabase SQL Editor (after backup), then refresh. Totals are incomplete until setup succeeds.</p><button class="pill active" onclick="bootApp()" style="margin-top:8px">Retry loading</button></div>`);
  }
  // Keep Home focused on financial information; personalization stays in the header settings control.
  el.classList.remove("fade-in"); void el.offsetWidth; el.classList.add("fade-in");
  refreshIcons();
}

function chatBubbleHtml(m) {
  const isUser = m.role === "user";
  return `<div class="chat-msg ${isUser?"user":"assistant"}">
    ${!isUser ? `<div class="chat-avatar">${icon("sparkles")}</div>` : ""}
    <div class="chat-bubble ${isUser?"user":"assistant"}">${m.html}</div>
  </div>`;
}
function renderAsk() {
  const daily = generateDailyInsights();
  return `
  <div class="ask-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px">
    <div>
      <p class="label" style="display:flex;align-items:center;gap:6px">${icon("sparkles",'style="width:12px;height:12px"')} AI Insights</p>
      <h2 class="heading-lg" style="margin-top:4px">Ask your finances anything</h2>
      <p class="body-sm" style="margin-top:4px">Answers are computed instantly from your own data on this device \u2014 no network calls.</p>
    </div>
    <button class="icon-btn" style="flex-shrink:0" onclick="clearChat()" title="Clear chat">${icon("rotate-ccw")}</button>
  </div>
  <div class="card" style="margin:14px 0">
    <p class="label" style="margin-bottom:6px">Today</p>
    ${daily.map(t => `<div class="caption" style="padding:3px 0">${esc(t)}</div>`).join("")}
  </div>
  <div class="chat-messages" id="chat-messages">${CHAT_MSGS.map(chatBubbleHtml).join("")}</div>
  <div style="height:170px"></div>
  `;
}
function renderChatMessages() {
  const el = document.getElementById("chat-messages");
  if (!el) return;
  el.innerHTML = CHAT_MSGS.map(chatBubbleHtml).join("");
  refreshIcons();
  requestAnimationFrame(() => window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" }));
}
function sendChatMsg() {
  const input = document.getElementById("chat-input");
  const q = input.value.trim();
  if (!q) return;
  CHAT_MSGS.push({ role: "user", html: esc(q) });
  CHAT_MSGS.push({ role: "assistant", html: answerFinanceQuestion(q) });
  cf21SaveChatHistory();
  input.value = "";
  renderChatMessages();
  buildChatSuggestions();
}
function askSuggested(q) { document.getElementById("chat-input").value = q; sendChatMsg(); }
function clearChat() {
  CHAT_MSGS = [{ role:"assistant", html:'<span class="cb-line">Chat cleared. Ask me anything about your finances!</span>' }];
  cf21SaveChatHistory();
  renderMain();
}
function buildChatSuggestions() {
  const el = document.getElementById("chat-suggest");
  if (!el) return;
  const s = ["Give me my weekly report", "Give me my monthly review", "How much did I spend this month?", "What's my biggest expense category?", "Am I saving enough?"];
  if (BUDGETS.some(b => b.month === monthStr(new Date()))) s.push("Am I over budget?");
  if (GOALS.length) s.push(`How's my ${GOALS[0].name} goal going?`);
  if (BILLS.some(b => b.isActive && !b.isPaid)) s.push("What bills are due soon?");
  s.push("Will I stay on track this month?");
  el.innerHTML = s.slice(0,6).map(q => `<button class="pill" onclick="askSuggested('${q.replace(/'/g,"\\'")}')">${esc(q)}</button>`).join("");
}

function txRowHtml(t) {
  const cat = getCat(t.category, t.type);
  const isInc = t.type === "income";
  const amt = parseFloat(t.amount);
  const time = new Date(t.createdAt).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" });
  const split = SPLITS.find(s => s.transactionId === t.id);
  let splitBadge = "";
  if (split) {
    const parts = PARTICIPANTS.filter(p => p.splitId === split.id && !p.isPayer);
    const settled = parts.filter(p => p.status === "settled").length;
    splitBadge = `<span class="tx-split-badge" onclick='event.stopPropagation();openSplitDetail(${JSON.stringify(t.id)})'>${icon("users",'style="width:9px;height:9px"')} ${settled}/${parts.length} settled</span>`;
  } else if (t.type === "expense") {
    splitBadge = `<span class="tx-split-badge" style="background:var(--surface-2);color:var(--text-3)" onclick='event.stopPropagation();onSplitTxClick(${JSON.stringify(t.id)})'>${icon("users",'style="width:9px;height:9px"')} Split</span>`;
  }
  return `
  <div class="tx-row card-flat">
    <div class="tx-icon" style="background:${cat.soft}">
      ${icon(cat.icon, 'style="color:'+cat.color+'"')}
      <div class="tx-badge" style="background:${isInc ? "var(--green)" : "var(--red)"}">${icon(isInc ? "arrow-up-right" : "arrow-down-left")}</div>
    </div>
    <div class="tx-main">
      <div class="tx-title">${esc(t.description || cat.label)} ${t.notes ? '<span style="opacity:.4">•</span>' : ""}</div>
      <div class="tx-meta"><span>${esc(cat.label)}</span><span>·</span><span>${time}</span>${t.paymentMethod?`<span style="padding:1px 5px;border-radius:4px;font-size:8px;font-weight:700;background:var(--surface-2);color:var(--text-3)">${esc(t.paymentMethod.toUpperCase())}</span>`:""}${t.isRecurring ? '<span style="padding:1px 5px;border-radius:4px;font-size:8px;font-weight:700;background:var(--blue-soft);color:var(--blue)">AUTO</span>' : ""}${splitBadge}</div>
    </div>
    <span class="tx-amt" style="color:${isInc ? "var(--green)" : "var(--red)"}">${isInc?"+":"-"}${fmt(amt, t.currency)}</span>
    <button class="cf2-icon-action" aria-label="Edit transaction" title="Edit" onclick='cf2OpenEdit(${JSON.stringify(t.id)})'>${icon("pencil")}</button>
    <button class="tx-del" aria-label="Delete transaction" onclick='onDeleteTx(${JSON.stringify(t.id)})'>${icon("trash-2")}</button>
  </div>`;
}
let cf2EditingId=null;
function cf2CloseEdit(){cf2EditingId=null;document.getElementById("cf2-edit-overlay").classList.remove("open");document.getElementById("cf2-edit-box").classList.remove("open");}

      <div class="cf2-edit-grid"><div class="cf2-form-field"><label for="cf2-edit-category">Category</label><select class="input" id="cf2-edit-category">${opts(t.type,t.category)}</select></div>
      <div class="cf2-form-field"><label for="cf2-edit-currency">Currency</label><select class="input" id="cf2-edit-currency">${CURRENCIES.map(c=>`<option value="${c.code}" ${c.code===t.currency?"selected":""}>${c.code}</option>`).join("")}</select></div></div>
      <div class="cf2-form-field"><label for="cf2-edit-date">Date</label><input class="input" id="cf2-edit-date" type="date" required value="${esc(t.date.slice(0,10))}"></div>

    </form>`;

function computeFriendBalances() {
  return FRIENDS.map(f => {
    const parts = PARTICIPANTS.filter(p => p.friendId === f.id);
    const pending = parts.filter(p => p.status === "pending");
    const owed = pending.reduce((s,p) => s + (parseFloat(p.amountOwed)||0), 0);
    const lastPart = parts.slice().sort((a,b) => (b.id||0)-(a.id||0))[0];
    const lastSplit = lastPart ? SPLITS.find(s => s.id === lastPart.splitId) : null;
    const lastLabel = lastSplit ? splitSubjectInfo(lastSplit).title : null;
    return { friend: f, owed, pendingCount: pending.length, hasHistory: parts.length > 0, lastLabel };
  }).filter(r => r.hasHistory).sort((a,b) => b.owed - a.owed);
}
async function settleAllForFriend(friendId) {
  const pending = PARTICIPANTS.filter(p => p.friendId === friendId && p.status === "pending");
  if (!pending.length) return;
  const f = FRIENDS.find(x => x.id === friendId);
  if (!confirm(`Mark all ${pending.length} pending split${pending.length>1?"s":""} from ${f?f.name:"this person"} as settled?`)) return;
  for (const p of pending) { await toggleParticipantStatus(p.id); }
  renderMain();
}
/* ══════════════════════════════════════════════
   FINANCIAL HEALTH SCORE
   Every number below is computed from real TXS/BUDGETS/GOALS/BILLS —
   nothing here is a placeholder or a fabricated figure.
   ══════════════════════════════════════════════ */
function computeFinancialHealthScore(monthOverride) {
  const now = new Date();
  const thisM = monthOverride || monthStr(now);
  const refDate = monthOverride ? new Date(monthOverride+"-01") : now;
  const lastM = monthStr(new Date(refDate.getFullYear(), refDate.getMonth()-1, 1));
  const thisTxs = TXS.filter(t => t.date.slice(0,7) === thisM);
  const lastTxs = TXS.filter(t => t.date.slice(0,7) === lastM);
  const income = thisTxs.filter(t=>t.currency==="USD"&&t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const expense = thisTxs.filter(t=>t.currency==="USD"&&t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);
  const lastExpense = lastTxs.filter(t=>t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);

  // Savings rate: (income - expense) / income, scaled to 0-100
  const savingsRate = income > 0 ? (income - expense) / income : (expense > 0 ? -1 : 0);
  const savingsScore = clamp(Math.round(50 + savingsRate * 100), 0, 100);

  // Spending control: % of that month's budget categories that stayed within budget
  const thisMonthBudgets = BUDGETS.filter(b => b.month === thisM);
  let spendingScore = 70; // neutral default when there's not enough budget data yet
  if (thisMonthBudgets.length > 0) {
    const withinBudget = thisMonthBudgets.filter(b => {
      const spent = thisTxs.filter(t => t.type==="expense" && t.category===b.category).reduce((s,t)=>s+parseFloat(t.amount),0);
      return spent <= parseFloat(b.amount);
    }).length;
    spendingScore = Math.round((withinBudget / thisMonthBudgets.length) * 100);
  }

  // Bills and Goals reflect current live state regardless of monthOverride — the app
  // doesn't keep historical snapshots of bill/goal status, so trend comparisons below
  // are driven by savings/spending/cash-flow only, which ARE cleanly historical.
  const activeBills = BILLS.filter(b => b.isActive);
  const today = dayStr();
  const billsScore = activeBills.length > 0
    ? Math.round((activeBills.filter(b => !b.nextDue || b.nextDue >= today).length / activeBills.length) * 100)
    : 100;

  // Goals: average progress across active goals, capped at 100 each
  const goalsScore = GOALS.length > 0
    ? Math.round(GOALS.reduce((s,g) => s + clamp((parseFloat(g.currentAmount)/parseFloat(g.targetAmount||1))*100, 0, 100), 0) / GOALS.length)
    : 70; // neutral default with no goals set yet

  // Cash flow: this month's net, scaled against income (or a flat penalty if no income logged)
  const netFlow = income - expense;
  const cashFlowScore = income > 0 ? clamp(Math.round(50 + (netFlow/income) * 100), 0, 100) : (netFlow >= 0 ? 60 : 30);

  const overall = Math.round(savingsScore*0.25 + spendingScore*0.2 + billsScore*0.2 + goalsScore*0.15 + cashFlowScore*0.2);

  // Explanations: only generated when the underlying comparison actually has data on both sides.
  const explanations = [];
  if (lastExpense > 0 && expense > 0) {
    const changePct = Math.round(((expense - lastExpense) / lastExpense) * 100);
    if (changePct <= -5) explanations.push(`Your score is up because total spending is ${Math.abs(changePct)}% lower than last month.`);
    else if (changePct >= 5) explanations.push(`Your score is down because total spending is ${changePct}% higher than last month.`);
  }
  if (income > 0 && savingsRate < 0.2) {
    const targetSavings = Math.round(income * 0.2 - (income - expense));
    if (targetSavings > 0) explanations.push(`Your score can improve by saving about ${fmt(targetSavings)} more this month.`);
  }
  if (activeBills.some(b => b.nextDue && b.nextDue < today)) {
    explanations.push(`You have an overdue bill — catching it up will raise your Bills score.`);
  }
  if (!explanations.length) explanations.push(income===0 && expense===0 ? "Log a few transactions this month to get a real score." : "Keep logging transactions for more personalized explanations.");

  return { overall, breakdown: { savings:savingsScore, spendingControl:spendingScore, bills:billsScore, goals:goalsScore, cashFlow:cashFlowScore }, explanations, income, expense };
}
function clamp(n, lo, hi) { return Math.max(lo, Math.min(hi, n)); }
function computeHealthTrend() {
  const now = new Date();
  const thisM = monthStr(now);
  const lastM = monthStr(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const cur = computeFinancialHealthScore(thisM);
  const prev = computeFinancialHealthScore(lastM);
  const delta = cur.overall - prev.overall;
  const reasons = [];
  if (cur.breakdown.savings > prev.breakdown.savings) reasons.push("Increased savings");
  if (cur.breakdown.spendingControl > prev.breakdown.spendingControl) reasons.push("Reduced unnecessary spending");
  if (cur.breakdown.bills >= 90) reasons.push("Paid bills on time");
  if (cur.breakdown.cashFlow > prev.breakdown.cashFlow) reasons.push("Improved cash flow");
  return { score: cur.overall, delta, reasons, hasComparison: prev.income > 0 || prev.expense > 0 };
}

/* ══════════════════════════════════════════════
   AUTOMATIC INSIGHTS ENGINE
   Each detector only fires when the underlying data actually
   supports the claim — no insight is shown without real numbers behind it.
   ══════════════════════════════════════════════ */
function generateInsights() {
  const insights = [];
  const now = new Date();
  const thisM = monthStr(now);
  const lastM = monthStr(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const thisTxs = TXS.filter(t => t.date.slice(0,7) === thisM);
  const lastTxs = TXS.filter(t => t.date.slice(0,7) === lastM);
  const income = thisTxs.filter(t=>t.currency==="USD"&&t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const today = dayStr();

  // Overspending per category vs last month
  const catTotals = (txs) => { const m = {}; txs.filter(t=>t.type==="expense").forEach(t => { m[t.category] = (m[t.category]||0) + parseFloat(t.amount); }); return m; };
  const thisCat = catTotals(thisTxs), lastCat = catTotals(lastTxs);
  Object.keys(thisCat).forEach(cat => {
    if (lastCat[cat] > 0) {
      const pct = Math.round(((thisCat[cat] - lastCat[cat]) / lastCat[cat]) * 100);
      if (pct >= 25) insights.push({ icon:"trending-up", type:"warning", text:`You've spent ${pct}% more on ${getCat(cat,"expense").label.toLowerCase()} than last month (${fmt(thisCat[cat])} vs ${fmt(lastCat[cat])}).` });
    }
  });

  // Subscriptions: active recurring expenses
  const activeRecurring = RECURRING.filter(r => r.isActive && r.type === "expense");
  if (activeRecurring.length > 0) {
    const monthlyTotal = activeRecurring.reduce((s,r) => s + parseFloat(r.amount) * (r.frequency==="weekly"?4.33:r.frequency==="yearly"?(1/12):1), 0);
    insights.push({ icon:"repeat", type:"info", text:`You have ${activeRecurring.length} recurring payment${activeRecurring.length>1?"s":""} totaling about ${fmt(monthlyTotal)}/month.` });
  }

  // Cash flow risk: upcoming bills (next 30 days) vs this month's income so far
  const in30 = dayStr(new Date(now.getTime() + 30*86400000));
  const upcomingBillsTotal = BILLS.filter(b => b.isActive && b.nextDue && b.nextDue >= today && b.nextDue <= in30).reduce((s,b)=>s+parseFloat(b.amount),0);
  if (income > 0 && upcomingBillsTotal > income) {
    insights.push({ icon:"alert-triangle", type:"risk", text:`Upcoming bills in the next 30 days (${fmt(upcomingBillsTotal)}) exceed income logged this month (${fmt(income)}).` });
  }

  // Savings opportunity: biggest discretionary category this month (excluding rent/bills-type categories)
  const discretionary = Object.entries(thisCat).filter(([cat]) => !["rent","bills","utilities","loan","emi"].includes(cat)).sort((a,b)=>b[1]-a[1])[0];
  if (discretionary && discretionary[1] > 0) {
    insights.push({ icon:"lightbulb", type:"tip", text:`${getCat(discretionary[0],"expense").label} is your top discretionary spend this month at ${fmt(discretionary[1])} — trimming it is the fastest lever on your savings rate.` });
  }

  if (!insights.length) insights.push({ icon:"info", type:"info", text:"Log more transactions to start seeing personalized insights here." });
  return insights.slice(0, 5);
}
function generateDailyInsights() {
  const insights = [];
  const today = dayStr();
  const now = new Date();
  const thisM = monthStr(now);
  const thisTxs = TXS.filter(t => t.date.slice(0,7) === thisM);
  const income = thisTxs.filter(t=>t.currency==="USD"&&t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const expense = thisTxs.filter(t=>t.currency==="USD"&&t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);

  const nextIncome = RECURRING.filter(r => r.isActive && r.type==="income" && r.nextDue).sort((a,b)=>a.nextDue.localeCompare(b.nextDue))[0];
  if (nextIncome) insights.push(`You have ${fmt(income-expense)} available until your next paycheck on ${new Date(nextIncome.nextDue).toLocaleDateString("en-US",{month:"short",day:"numeric"})}.`);

  const in3 = dayStr(new Date(now.getTime()+3*86400000));
  const soonBill = BILLS.filter(b => b.isActive && b.nextDue && b.nextDue>=today && b.nextDue<=in3).sort((a,b)=>a.nextDue.localeCompare(b.nextDue))[0];
  if (soonBill) {
    const days = Math.round((new Date(soonBill.nextDue)-new Date(today))/86400000);
    insights.push(`Your ${esc(soonBill.name)} bill (${fmt(parseFloat(soonBill.amount))}) is due in ${days===0?"today":days+" day"+(days>1?"s":"")}.`);
  }

  const todaysTxs = TXS.filter(t => t.date.slice(0,10)===today && t.type==="expense");
  if (todaysTxs.length) {
    const cat = todaysTxs[0].category;
    const ago30 = new Date(now.getTime()-30*86400000);
    const histTxs = TXS.filter(t => t.type==="expense" && t.category===cat && new Date(t.date)>=ago30 && t.date.slice(0,10)!==today);
    if (histTxs.length >= 3) {
      const avgDaily = histTxs.reduce((s,t)=>s+parseFloat(t.amount),0)/30;
      const todayTotal = todaysTxs.filter(t=>t.category===cat).reduce((s,t)=>s+parseFloat(t.amount),0);
      if (avgDaily > 0 && todayTotal > avgDaily*1.5) {
        const pct = Math.round(((todayTotal-avgDaily)/avgDaily)*100);
        insights.push(`You're spending ${pct}% more on ${getCat(cat,"expense").label.toLowerCase()} today than your recent daily average.`);
      }
    }
  }
  if (!insights.length) insights.push("No urgent items today — log a transaction to keep your insights current.");
  return insights.slice(0,3);
}

const CF2_RESERVE_KEY = "cf2_planning_reserve";
function cf2Reserve() {
  const value = Number(Store.get(CF2_RESERVE_KEY, 500));
  return Number.isFinite(value) && value >= 0 ? value : 500;
}
function cf2StartBalance() {
  const raw=Store.get("cf2_opening_balance_"+(_cachedUserId||"unknown"),null);
  return raw===null?null:(Number.isFinite(Number(raw))?Number(raw):null);
}
function cf2UsdNet(){return TXS.filter(t=>t.currency==="USD").reduce((sum,t)=>sum+(t.type==="income"?1:-1)*(Number(t.amount)||0),0);}
function computeAffordData() {
  const opening=cf2StartBalance();
  const recorded=cf2UsdNet();
  const total=opening===null?null:opening+recorded;
  const start=dayStr();const endDate=new Date();endDate.setDate(endDate.getDate()+30);const end=dayStr(endDate);
  const bills=BILLS.filter(b=>b.isActive&&!b.isPaid&&b.nextDue&&b.nextDue>=start&&b.nextDue<=end&&b.currency==="USD").reduce((sum,b)=>sum+(Number(b.amount)||0),0);
  const reserve=cf2Reserve();
  return {opening,recorded,total,bills,reserve,safe:total===null?null:total-bills-reserve,excluded:TXS.filter(t=>t.currency!=="USD").length};
}

  document.getElementById("cf2-progress").style.width=(d.safe>0?Math.min(100,purchase/d.safe*100):100)+"%";

 const ev=[];

 // Upcoming recurring entries: use the saved next_due only; don't invent additional occurrences.
 RECURRING.filter(r=>r.isActive&&r.nextDue&&r.nextDue>=start&&r.nextDue<=end&&(r.currency||'USD')==='USD').forEach(r=>ev.push({date:r.nextDue,name:r.description||getCat(r.category,r.type).label,amount:Number(r.amount)||0,type:r.type==='income'?'expected':'recurring',sourceId:String(r.id),status:r.type==='income'?'Recurring income expected':'Recurring expense expected',icon:r.type==='income'?'arrow-down-left':'repeat',detail:'Scheduled entry, not a confirmed transaction'}));

/* ══════════════════════════════════════════════
   CASHFLOW AUTOPILOT
   Projects goal completion from real 30-day income/expense trend
   (computeForecast) and real recurring/discretionary data
   (generateInsights) — not fabricated dollar suggestions.
   ══════════════════════════════════════════════ */
function computeAutopilot(goal) {
  const forecast = computeForecast();
  const monthlyAbility = forecast.projSavings;
  const remaining = Math.max(parseFloat(goal.targetAmount) - parseFloat(goal.currentAmount), 0);
  let monthsRemaining = null, requiredMonthly = null;
  if (goal.deadline) {
    const now = new Date(), dl = new Date(goal.deadline);
    monthsRemaining = Math.max((dl.getFullYear()-now.getFullYear())*12 + (dl.getMonth()-now.getMonth()) + (dl.getDate()>=now.getDate()?0:-1), 0.1);
    requiredMonthly = remaining / monthsRemaining;
  }
  let status, predictedDate = null;
  if (remaining <= 0) status = "COMPLETE";
  else if (monthlyAbility <= 0) status = "BEHIND";
  else {
    predictedDate = new Date(); predictedDate.setMonth(predictedDate.getMonth() + Math.ceil(remaining/monthlyAbility));
    if (requiredMonthly !== null) status = monthlyAbility >= requiredMonthly*0.95 ? "ON TRACK" : monthlyAbility >= requiredMonthly*0.5 ? "AT RISK" : "BEHIND";
    else status = "ON TRACK";
  }
  const insights = generateInsights().filter(i => i.type !== "risk" || true).slice(0,3).map(i => i.text);
  return { remaining, monthlyAbility, requiredMonthly, monthsRemaining, status, predictedDate, recommendations: insights };
}
function autopilotCard(goal) {
  if (parseFloat(goal.currentAmount) >= parseFloat(goal.targetAmount)) return "";
  const ap = computeAutopilot(goal);
  const statusColor = ap.status === "ON TRACK" ? "var(--green)" : ap.status === "AT RISK" ? "var(--yellow, #e0a63c)" : "var(--red)";
  return `<div class="card-flat" style="padding:12px 14px;margin-top:8px;border-radius:10px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">

    ${ap.requiredMonthly !== null ? `<div class="caption">Needs ${fmt(ap.requiredMonthly)}/mo · currently saving ~${fmt(Math.max(ap.monthlyAbility,0))}/mo</div>` : `<div class="caption">Saving ~${fmt(Math.max(ap.monthlyAbility,0))}/mo based on the last 30 days</div>`}
    ${ap.predictedDate ? `<div class="caption" style="margin-top:2px">Projected to reach this goal around ${ap.predictedDate.toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</div>` : `<div class="caption" style="margin-top:2px">Not currently saving enough to project a completion date.</div>`}
    ${ap.recommendations.length ? `<div style="margin-top:6px;padding-top:6px;border-top:1px solid var(--border)">${ap.recommendations.map(r=>`<div class="caption" style="padding:2px 0">→ ${esc(r)}</div>`).join("")}</div>` : ""}
  </div>`;
}

function cf21SafeCSV(v){
  let t=String(v==null?'':v);
  if(/^[\s]*[=+@\-\t\r]/.test(t))t="'"+t; // defend against spreadsheet formula injection
  return '"'+t.replace(/"/g,'""')+'"';
}
function cf21DownloadText(text,name,type){
  const blob=new Blob([text],{type:type||'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),3000);
}
function cf21ClientCSV(personId){
  const person=PEOPLE.find(p=>String(p.id)===String(personId));if(!person)return;
  const work=cwEntries(personId).map(w=>({date:w.work_date,type:'Earned',amount:Number(w.amount),notes:w.notes||''}));
  const received=cwPayments(personId).map(t=>({date:t.date.slice(0,10),type:'Received',amount:Number(t.amount),notes:t.notes||''}));
  const rows=[...work,...received].sort((a,b)=>a.date.localeCompare(b.date));
  const earned=cwTotal(work,'amount'),paid=cwTotal(received,'amount');
  const report=[['Client','Date','Entry','Amount (USD)','Notes'],...rows.map(r=>[person.name,r.date,r.type,r.amount.toFixed(2),r.notes]),['TOTAL','', 'Earned',earned.toFixed(2),''],['TOTAL','', 'Received',paid.toFixed(2),''],['BALANCE','',earned>=paid?'Outstanding':'Client credit',Math.abs(earned-paid).toFixed(2),'']];
  const csv='\ufeff'+report.map(cols=>cols.map(cf21SafeCSV).join(',')).join('\r\n');
  cf21DownloadText(csv,'CashFlow_Client_'+dayStr()+'_'+String(person.name).replace(/[^a-z0-9_-]/gi,'_').slice(0,45)+'.csv');
}

function cf21Forecast(days){
  // Simple transparent projection: 90 calendar-day observed USD daily averages.
  const n=Math.min(90,Math.max(7,Number(days)||30));
  const today=new Date(dayStr()+'T12:00:00'),start=new Date(today);start.setDate(start.getDate()-89);
  const from=dayStr(start),to=dayStr(today);
  const relevant=TXS.filter(t=>t.currency==='USD'&&t.date.slice(0,10)>=from&&t.date.slice(0,10)<=to);
  const inflow=cwTotal(relevant.filter(t=>t.type==='income'),'amount'),outflow=cwTotal(relevant.filter(t=>t.type==='expense'),'amount');
  // Divide by window length from earliest included record, not number of recorded days.
  const earliest=relevant.length?relevant.reduce((v,t)=>t.date.slice(0,10)<v?t.date.slice(0,10):v,to):to;
  const age=Math.max(1,Math.min(90,Math.floor((today-new Date(earliest+'T12:00:00'))/86400000)+1));
  return {days:n,samples:relevant.length,observationDays:age,income:inflow/age*n,expense:outflow/age*n,net:(inflow-outflow)/age*n};
}

}

function getExportRange() {

  if (state.exportPreset === "month") { const s = new Date(now.getFullYear(), now.getMonth(), 1); return { start: dayStr(s), end: dayStr(now), label: now.toLocaleDateString("en-US",{month:"long",year:"numeric"}) }; }
  if (state.exportPreset === "lastMonth") { const s = new Date(now.getFullYear(), now.getMonth()-1, 1); const e = new Date(now.getFullYear(), now.getMonth(), 0); return { start: dayStr(s), end: dayStr(e), label: s.toLocaleDateString("en-US",{month:"long",year:"numeric"}) }; }
  if (state.exportPreset === "last3") { const s = new Date(now.getFullYear(), now.getMonth()-2, 1); return { start: dayStr(s), end: dayStr(now), label: `${s.toLocaleDateString("en-US",{month:"short",year:"numeric"})} \u2013 ${now.toLocaleDateString("en-US",{month:"short",year:"numeric"})}` }; }
  const start = state.exportStart;
  const end = state.exportEnd;
  return { start, end, label: start && end ? `${start} to ${end}` : "Custom range" };
}
function getFilteredTxs() {
  const { start, end } = getExportRange();
  let txs = TXS.filter(t => (!start || t.date.slice(0,10) >= start) && (!end || t.date.slice(0,10) <= end));
  if (state.exportType === "expense") txs = txs.filter(t => t.type === "expense");
  if (state.exportType === "income") txs = txs.filter(t => t.type === "income");
  return txs;
}
function exportReportTitle() {
  return state.exportType === "expense" ? "Expense Report" : state.exportType === "income" ? "Income Report" : "Complete Financial Report";
}
function categoryBreakdown(txs, type) {
  const m = {};
  txs.filter(t => t.type === type).forEach(t => { const label = getCat(t.category, type).label; m[label] = (m[label]||0) + parseFloat(t.amount); });
  return Object.entries(m).sort((a,b) => b[1]-a[1]);
}
function downloadBlob(blob, name) {
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 1000);
}
function exportCSVFile() {
  if (!validateExportRange()) return;
  const txs = getFilteredTxs();
  const range = getExportRange();
  const meta = [[`"${exportReportTitle()}"`], [`"Period: ${range.label}"`], [`"Exported: ${new Date().toLocaleDateString()}"`], [""]];
  const h = ["Date","Type","Category","Amount","Currency","Description","Notes"];
  const rows = txs.map(t => [new Date(t.date).toLocaleDateString(), t.type, getCat(t.category,t.type).label, t.amount, t.currency, t.description||"", t.notes||""]);
  const csv = meta.map(r=>r.join(",")).concat([h, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(","))).join("\n");
  downloadBlob(new Blob([csv], {type:"text/csv"}), `dhoot-${state.exportType}-${range.start||"all"}.csv`);
}
function exportExcel() {
  if (!validateExportRange()) return;
  const txs = getFilteredTxs();
  const range = getExportRange();
  const wb = XLSX.utils.book_new();
  const income = txs.filter(t=>t.type==="income").reduce((s,t)=>s+parseFloat(t.amount),0);
  const expense = txs.filter(t=>t.type==="expense").reduce((s,t)=>s+parseFloat(t.amount),0);
  const summaryRows = [{ Report: exportReportTitle(), Period: range.label, Exported: new Date().toLocaleDateString() }, {}];
  if (state.exportType !== "expense") summaryRows.push({ Metric: "Total Income", Amount: income });
  if (state.exportType !== "income") summaryRows.push({ Metric: "Total Expenses", Amount: expense });
  if (state.exportType === "all") summaryRows.push({ Metric: "Net", Amount: income-expense });
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(summaryRows, {skipHeader:true}), "Summary");
  const data = txs.map(t => ({ Date: new Date(t.date).toLocaleDateString(), Type: t.type, Category: getCat(t.category,t.type).label, Amount: parseFloat(t.amount), Currency: t.currency, Description: t.description||"", Notes: t.notes||"" }));
  XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Transactions");
  XLSX.writeFile(wb, `dhoot-${state.exportType}-${range.start||"all"}.xlsx`);
}

  if (state.exportType !== "income" && expense > 0) {

  if (state.exportType === "all") {

    doc.setFontSize(10); doc.setTextColor(0); doc.text(`Financial Health Score: ${health.overall}/100`, 14, y); y += 6;

  }

  doc.setFontSize(9); doc.setTextColor(0); doc.text("Transactions", 14, y); y += 2;
  doc.autoTable({ startY:y, head:[["Date","Type","Category","Amount","Description"]], body: txs.map(t => [new Date(t.date).toLocaleDateString(), t.type, getCat(t.category,t.type).label, fmt(parseFloat(t.amount), t.currency), t.description||""]), styles:{fontSize:8}, headStyles:{fillColor:[99,107,255]} });
  doc.save(`dhoot-${state.exportType}-${range.start||"all"}.pdf`);
}
function handleImport(e) {
  const file = e.target.files[0]; if (!file) return;
  Papa.parse(file, { header:true, skipEmptyLines:true, complete: async (r) => {
    const rows = [];
    let skipped = 0;
    const uid = await getUserId();
    r.data.forEach(row => {
      const t = (row.type||"").toLowerCase().trim();
      const a = parseFloat(row.amount);
      const c = (row.category||"").toLowerCase().trim();
      if ((t!=="income" && t!=="expense") || isNaN(a) || a<=0 || !c) { skipped++; return; }
      rows.push({ type:t, amount:a, category:c, description:row.description||"", notes:row.notes||"", currency:row.currency||"USD", date: row.date ? new Date(row.date).toISOString() : new Date().toISOString(), is_recurring:false, recurring_id:null, user_id: uid });
    });
    e.target.value = "";
    if (!rows.length) { alert(`Imported 0, skipped ${skipped}`); return; }
    const { data, error } = await sb.from("transactions").insert(rows).select();
    if (error) { alert("Import failed: " + error.message); return; }
    TXS = data.map(mapTx).concat(TXS);
    alert(`Imported ${data.length}, skipped ${skipped}`);
    renderMain();
  }});
}

function calcSplitAmounts(total, sp) {
  total = Math.round((total || 0) * 100) / 100;
  const friends = FRIENDS.filter(f => sp.friendIds.includes(f.id));
  const participants = (sp.enabled !== false) ? [{ id:"you", name:"You", isPayer:true }, ...friends.map(f => ({ id:f.id, name:f.name, isPayer:false, color:f.avatarColor }))] : [];
  const n = participants.length;
  let amounts = {};
  if (n > 0) {
    if (sp.mode === "equal") {
      const totalCents = Math.round(total * 100);
      const base = Math.floor(totalCents / n);
      const leftover = totalCents - base * n;
      participants.forEach((p, i) => { amounts[p.id] = (base + (i < leftover ? 1 : 0)) / 100; });
    } else {
      participants.forEach(p => { amounts[p.id] = parseFloat(sp.exact[p.id]) || 0; });
    }
  }
  const allocated = Math.round(Object.values(amounts).reduce((s,v) => s+v, 0) * 100) / 100;
  const remaining = Math.round((total - allocated) * 100) / 100;
  const isBalanced = sp.mode === "equal" || Math.abs(remaining) < 0.01;
  return { total, participants, amounts, remaining, isBalanced };
}
function computeSplitCalc() {
  const total = parseFloat(document.getElementById("tx-amount").value) || 0;
  return calcSplitAmounts(total, modalState.split);
}
function renderSplitSection() {
  const container = document.getElementById("split-section");

  let html = `<div class="split-card">
    <div class="split-head-row">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:28px;height:28px;border-radius:999px;background:var(--blue-soft);color:var(--blue);display:flex;align-items:center;justify-content:center">${icon("users",'style="width:14px;height:14px"')}</span>
        <div>
          <div style="font-size:.8125rem;font-weight:700">Split this expense</div>
          <div class="caption">Divide the cost with friends</div>
        </div>
      </div>
      <button class="split-toggle${sp.enabled?" on":""}" onclick="toggleSplitEnabled()"><span class="split-toggle-knob"></span></button>
    </div>`;
  if (sp.enabled) {
    html += `<div class="split-body">
      <p class="label" style="margin-bottom:8px">Split with</p>
      <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
        ${FRIENDS.map(f => {
          const sel = sp.friendIds.includes(f.id);
          return `<button type="button" class="pill friend-chip${sel?" selected":""}" onclick="toggleSplitFriend(${f.id})">
            <span class="friend-avatar" style="background:${f.avatarColor}">${esc(f.name.split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase())}</span>
            ${esc(f.name)}${sel?icon("check",'style="width:11px;height:11px"'):""}
          </button>`;
        }).join("")}
        <button type="button" class="pill" onclick="toggleAddFriendInput()">${icon("plus",'style="width:11px;height:11px"')} Add friend</button>
      </div>
      ${sp.addingFriend ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:14px">
        <input class="input" id="new-friend-name" placeholder="Friend's name" onkeydown="if(event.key==='Enter')document.getElementById('new-friend-email').focus();">
        <input class="input" id="new-friend-email" type="email" placeholder="Email (optional, for notifications)" onkeydown="if(event.key==='Enter')submitNewFriend();">
        <button class="btn-primary" onclick="submitNewFriend()">Add friend</button>
      </div>` : ""}
      <div class="split-mode-tabs">
        <button class="split-mode-tab${sp.mode==="equal"?" active":""}" onclick="setSplitMode('equal')">Split Equally</button>
        <button class="split-mode-tab${sp.mode==="exact"?" active":""}" onclick="setSplitMode('exact')">Split Exactly</button>
      </div>`;
    if (calc.participants.length > 1) {
      html += calc.participants.map(p => `<div class="split-participant-row">
        <span style="font-size:.75rem">${esc(p.name)}${p.isPayer?' <span style="color:var(--text-4);font-size:.625rem">(paid)</span>':""}</span>
        ${sp.mode === "equal"
          ? `<span class="mono" style="font-size:.75rem">${fmt(calc.amounts[p.id]||0)}</span>`
          : `<input type="number" step="0.01" min="0" class="split-exact-input" value="${sp.exact[p.id] ?? (calc.amounts[p.id]||0).toFixed(2)}" oninput="setSplitExactAmount('${p.id}', this.value)">`
        }
      </div>`).join("");
      if (sp.mode === "exact") {
        const bal = calc.isBalanced;
        html += `<div class="split-balance-banner" id="split-balance-banner" style="background:${bal?"var(--green-soft)":"var(--red-soft)"};color:${bal?"var(--green)":"var(--red)"}">
          <span>${bal ? "Amounts match the total" : (calc.remaining>0 ? "Remaining to allocate" : "Over the total by")}</span>
          ${bal?"":`<span class="mono">${fmt(Math.abs(calc.remaining))}</span>`}
        </div>`;
      }
    } else {
      html += `<p class="caption" style="text-align:center;padding:14px 0">Pick at least one friend to split with.</p>`;
    }
    html += `</div>`;
  }
  html += `</div>`;
  container.innerHTML = html;
  refreshIcons();
}
function toggleSplitEnabled() { modalState.split.enabled = !modalState.split.enabled; renderSplitSection(); }
function toggleSplitFriend(id) {

  delete sp.exact[id];

function setSplitMode(mode) {
  const sp = modalState.split;
  if (mode === "exact") { const calc = computeSplitCalc(); calc.participants.forEach(p => { if (sp.exact[p.id] === undefined) sp.exact[p.id] = (calc.amounts[p.id]||0).toFixed(2); }); }
  sp.mode = mode; renderSplitSection();
}
function setSplitExactAmount(id, value) {
  modalState.split.exact[id] = value;
  const calc = computeSplitCalc();
  const banner = document.getElementById("split-balance-banner");
  if (!banner) return;
  const bal = calc.isBalanced;
  banner.style.background = bal ? "var(--green-soft)" : "var(--red-soft)";

  banner.innerHTML = `<span>${bal ? "Amounts match the total" : (calc.remaining>0 ? "Remaining to allocate" : "Over the total by")}</span>${bal?"":`<span class="mono">${fmt(Math.abs(calc.remaining))}</span>`}`;
}

async function modalSubmit() {

  if (!amount || !category || !Number.isFinite(Number(amount)) || Number(amount)<=0) { alert("Enter an amount greater than zero."); return; }
  if (!paymentMethodValid()) { alert("Pick a payment method first."); return; }
  const sp = modalState.split;
  const calc = computeSplitCalc();
  const splitReady = sp.enabled && calc.participants.length > 1 && calc.isBalanced;
  if (sp.enabled && calc.participants.length > 1 && !calc.isBalanced) { alert("Split amounts don't add up to the total yet."); return; }
  const btn = document.getElementById("tx-submit");

  if (txRow && splitReady) {
    await saveSplitForTransaction(txRow.id, {
      mode: sp.mode, totalAmount: calc.total,
      participants: calc.participants.map(p => ({ friendId: p.isPayer ? null : p.id, isPayer: p.isPayer, displayName: p.name, amountOwed: calc.amounts[p.id]||0, status: p.isPayer ? "settled" : "pending" })),

}

/* ══════════════════════════════════════════════
   AUTH
   ══════════════════════════════════════════════ */
let authMode = "signin"; // signin | signup | forgot | reset

function renderAuthScreen() {
  const card = document.getElementById("auth-card");
  const brand = `<div class="brand" style="justify-content:center;margin-bottom:22px">
      <div class="brand-icon">${icon("activity")}</div>
      <div><div class="brand-name">CashFlow</div></div>
    </div>`;
  const msgs = `<p id="auth-error" style="color:var(--red);font-size:.75rem;margin-bottom:10px;display:none"></p>
    <p id="auth-info" style="color:var(--text-3);font-size:.75rem;margin-bottom:10px;display:none"></p>`;
  const linkBtnStyle = "background:none;border:none;padding:0;font-size:.75rem;color:var(--text-3);text-decoration:underline;cursor:pointer";
  let body;
  if (authMode === "reset") {
    body = `
      <p style="font-size:.8125rem;color:var(--text-2);margin-bottom:16px;text-align:center">Choose a new password for your account.</p>
      <form onsubmit="submitReset(); return false;">
        <input class="input" id="auth-password" type="password" autocomplete="new-password" placeholder="New password" style="margin-bottom:10px">
        <input class="input" id="auth-password2" type="password" autocomplete="new-password" placeholder="Confirm new password" style="margin-bottom:10px">
        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">Update Password</button>
      </form>`;
  } else if (authMode === "forgot") {
    body = `
      <p style="font-size:.8125rem;color:var(--text-2);margin-bottom:16px;text-align:center">Enter your email and we'll send a reset link.</p>
      <form onsubmit="submitForgot(); return false;">
        <input class="input" id="auth-email" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:10px">
        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">Send Reset Link</button>
      </form>
      <button style="${linkBtnStyle};display:block;margin:14px auto 0" onclick="setAuthMode('signin')">Back to sign in</button>`;
  } else {
    body = `
      <div class="manage-tabs" style="margin-bottom:16px">
        <button class="pill ${authMode==="signin"?"active":""}" onclick="setAuthMode('signin')" style="flex:1;justify-content:center">Sign In</button>
        <button class="pill ${authMode==="signup"?"active":""}" onclick="setAuthMode('signup')" style="flex:1;justify-content:center">Sign Up</button>
      </div>
      <form onsubmit="submitAuth(); return false;">
        <input class="input" id="auth-email" type="email" autocomplete="email" placeholder="Email" style="margin-bottom:10px">
        <input class="input" id="auth-password" type="password" autocomplete="${authMode==="signin"?"current-password":"new-password"}" placeholder="Password" style="margin-bottom:8px">
        <div style="text-align:right;margin-bottom:10px;min-height:14px">${authMode==="signin"?`<button type="button" style="${linkBtnStyle}" onclick="setAuthMode('forgot')">Forgot password?</button>`:""}</div>
        ${msgs}
        <button type="submit" class="btn-primary" id="auth-submit" style="width:100%">${authMode==="signin"?"Sign In":"Create Account"}</button>
      </form>`;
  }
  card.innerHTML = brand + body;
  refreshIcons();
}
function setAuthMode(mode) { authMode = mode; renderAuthScreen(); }
function hideAuthMsgs() {
  const e1 = document.getElementById("auth-error"), e2 = document.getElementById("auth-info");
  if (e1) e1.style.display = "none";
  if (e2) e2.style.display = "none";
}
function showAuthError(msg) { hideAuthMsgs(); const el = document.getElementById("auth-error"); el.textContent = msg; el.style.display = "block"; }
function showAuthInfo(msg) { hideAuthMsgs(); const el = document.getElementById("auth-info"); el.textContent = msg; el.style.display = "block"; }

async function submitAuth() {
  const email = document.getElementById("auth-email").value.trim();
  const password = document.getElementById("auth-password").value;
  hideAuthMsgs();
  if (!email || !password) { showAuthError("Enter both email and password."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    if (authMode === "signin") {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw error;
    } else {
      const { data, error } = await sb.auth.signUp({ email, password });
      if (error) throw error;
      if (data.session === null) { showAuthInfo("Account created — check your email to confirm before signing in."); btn.disabled = false; btn.textContent = orig; return; }
    }
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
    btn.disabled = false; btn.textContent = orig;
  }
}
async function submitForgot() {
  const email = document.getElementById("auth-email").value.trim();
  hideAuthMsgs();
  if (!email) { showAuthError("Enter your email."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split("#")[0] });
    if (error) throw error;
    showAuthInfo("Check your email for a password reset link.");
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
  } finally {
    btn.disabled = false; btn.textContent = orig;
  }
}
async function submitReset() {
  const pw = document.getElementById("auth-password").value;
  const pw2 = document.getElementById("auth-password2").value;
  hideAuthMsgs();
  if (!pw || pw.length < 6) { showAuthError("Password must be at least 6 characters."); return; }
  if (pw !== pw2) { showAuthError("Passwords don't match."); return; }
  const btn = document.getElementById("auth-submit");
  const orig = btn.textContent; btn.disabled = true; btn.innerHTML = '<div class="spinner"></div>';
  try {
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;
    showAuthInfo("Password updated — signing you in...");
    setTimeout(() => { authMode = "signin"; hideAuthScreen(); bootApp(); }, 1000);
  } catch (err) {
    showAuthError(err.message || "Something went wrong.");
    btn.disabled = false; btn.textContent = orig;
  }
}
async function handleSignOut() { await sb.auth.signOut(); }

function showAuthScreen() { document.getElementById("auth-screen").style.display = "flex"; }
function hideAuthScreen() { document.getElementById("auth-screen").style.display = "none"; }


/* CashFlow account-specific onboarding. All existing features remain accessible. */
const CF_PROFILES=[['student','Student','graduation-cap'],['employee','Salaried employee','briefcase-business'],['hourly','Hourly worker','clock-3'],['freelancer','Freelancer / business owner','laptop'],['family','Household / family','users'],['other','Personal finance','wallet']];
const CF_FEATURES=[['expenses','Income & expenses','arrow-left-right','story'],['budget','Budgets & bills','piggy-bank','story'],['insights','Financial insights','sparkles','ask'],['work','Work & paychecks','clock-3','work'],['clients','Client payments','users','people'],['calendar','Calendar','calendar-days','calendar'],['reports','Reports & exports','download','tools']];
const CF_DEFAULT_FEATURES=['expenses','budget','insights','work','clients'];
let cfOnboardingDraft=null;
let cfOnboardingPromptedUser=null;
function cfOnboardingKey(){return _cachedUserId?'cf_onboarding_v1_'+_cachedUserId:null;}
function cfReadOnboarding(){const k=cfOnboardingKey();if(!k)return null;try{const raw=localStorage.getItem(k);if(!raw)return null;const p=JSON.parse(raw);if(!p||!Array.isArray(p.features))return null;return {profile:p.profile||'employee',features:p.features.filter(f=>CF_FEATURES.some(x=>x[0]===f)),completed:!!p.completed};}catch(e){return null;}}
function cfOpenOnboarding(firstRun=false){
 if(!_cachedUserId)return;
 const saved=cfReadOnboarding();cfOnboardingDraft={profile:saved?.profile||'employee',features:[...(saved?.features||CF_DEFAULT_FEATURES)],firstRun:!!firstRun};
 const layer=document.getElementById('cf-onboard-layer');layer.classList.add('open');cfRenderOnboarding();
}
function cfRenderOnboarding(){
 const p=cfOnboardingDraft;if(!p)return;
 document.getElementById('cf-onboard-content').innerHTML=`<div class="cf-onboard-top"><span class="cf-onboard-kicker">Your CashFlow experience</span>${p.firstRun?'':`<button class="icon-btn" type="button" aria-label="Close personalization" onclick="cfCloseOnboarding()">${icon('x')}</button>`}</div>
 <h2 class="cf-onboard-title" id="cf-onboard-heading">Make CashFlow yours.</h2>
 <p class="cf-onboard-desc">Pick a starting point and the tools that matter most. You can change this anytime; all existing features and records stay available.</p>
 <p class="cf-onboard-step">01 / What best describes you?</p>
 <div class="cf-profile-options">${CF_PROFILES.map(([id,name,ico])=>`<button type="button" class="cf-profile-choice ${p.profile===id?'selected':''}" aria-pressed="${p.profile===id}" onclick="cfChooseProfile('${id}')">${icon(ico)} ${name}</button>`).join('')}</div>
 <p class="cf-onboard-step">02 / What would you like on your home screen?</p>
 <div class="cf-feature-grid">${CF_FEATURES.map(([id,label,ico])=>`<label class="cf-feature-choice ${p.features.includes(id)?'selected':''}"><input type="checkbox" ${p.features.includes(id)?'checked':''} onchange="cfToggleFeature('${id}',this.checked)">${icon(ico)}<span>${label}</span></label>`).join('')}</div>
 <div class="cf-onboard-foot"><p class="cf-onboard-note">Preferences are saved on this device for your signed-in CashFlow account. Financial data remains in your existing Supabase tables.</p><button class="btn-primary" type="button" onclick="cfSaveOnboarding()">${p.firstRun?'Create my workspace':'Save preferences'} ${icon('arrow-right')}</button></div>`;
 refreshIcons();
}
function cfChooseProfile(id){if(!CF_PROFILES.some(x=>x[0]===id))return;cfOnboardingDraft.profile=id;cfRenderOnboarding();}
function cfToggleFeature(id,checked){if(!CF_FEATURES.some(x=>x[0]===id))return;const f=new Set(cfOnboardingDraft.features);if(checked)f.add(id);else f.delete(id);cfOnboardingDraft.features=[...f];cfRenderOnboarding();}
function cfCloseOnboarding(){const p=cfOnboardingDraft;if(p?.firstRun)return;document.getElementById('cf-onboard-layer').classList.remove('open');cfOnboardingDraft=null;}
function cfSaveOnboarding(){const key=cfOnboardingKey();if(!key||!cfOnboardingDraft)return;try{localStorage.setItem(key,JSON.stringify({profile:cfOnboardingDraft.profile,features:cfOnboardingDraft.features,completed:true,updatedAt:new Date().toISOString()}));}catch(e){alert('This browser blocked saving preferences. Please allow site storage and retry.');return;}document.getElementById('cf-onboard-layer').classList.remove('open');cfOnboardingDraft=null;state.tab='story';document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab==='story'));renderMain();}
function cfPersonalPanel(){
 const p=cfReadOnboarding();if(!p?.completed)return '';
 const profile=CF_PROFILES.find(x=>x[0]===p.profile)?.[1]||'Personal finance';
 const selected=CF_FEATURES.filter(f=>p.features.includes(f[0]));
 return `<section class="cf-personal-panel" aria-label="Personalized shortcuts"><div class="cf-personal-head"><div><div class="cf-onboard-kicker">MY CASHFLOW</div><h3>Your workspace</h3><p>${esc(profile)} · Your chosen tools, one tap away</p></div><button class="cf-personal-personalize" onclick="cfOpenOnboarding(false)">${icon('sliders-horizontal')} Customize</button></div><div class="cf-personal-links">${selected.length?selected.map(([id,label,ico,tab])=>`<button class="cf-personal-link" type="button" onclick="cfGoFeature('${id}','${tab}')">${icon(ico)}<span>${esc(label)}</span>${icon('arrow-up-right')}</button>`).join(''):`<p class="body-sm">Choose a few favorite tools using Customize.</p>`}</div></section>`;
}
function cfGoFeature(id,tab){if(id==='budget'){state.mTab='budgets';}switchTab(tab);}
function cfMaybeOnboard(){if(!_cachedUserId)return;const p=cfReadOnboarding();if(p?.completed)return;if(cfOnboardingPromptedUser===_cachedUserId)return;cfOnboardingPromptedUser=_cachedUserId;cfOpenOnboarding(true);}

let cfBootSerial=0;
async function bootApp() {
  const cfBootId=++cfBootSerial;
  document.getElementById("main-content").innerHTML = `
    <div class="skeleton" style="height:120px;margin-bottom:20px"></div>
    <div class="skeleton" style="height:180px;margin-bottom:20px"></div>
    <div class="skeleton" style="height:220px"></div>`;
  try {
    const sessionUid=await getUserId();
    if(!sessionUid)throw new Error('Not authenticated');
    await loadAllFromSupabase();
    await dhootLoadWork();
    if(cfBootId!==cfBootSerial)return;
    CHAT_MSGS=cf21GetChatHistory() || [{role:'assistant',html:'Ask me about your spending, budgets, and bills. Answers are computed locally from your loaded records.'}];
  } catch (err) {
    if(cfBootId!==cfBootSerial)return;
    console.error(err);
    document.getElementById("main-content").innerHTML = `<div class="card empty-state">${icon("cloud-off")}<p class="heading-md" style="margin-bottom:4px">Can't reach the database</p><p class="body-sm">Your data has not been changed. Check the connection, then retry.</p><button class="btn-primary" style="margin:16px auto;max-width:180px" onclick="bootApp()">Retry loading</button></div>`;
    refreshIcons();
    return;
  }
  renderMain();
  refreshIcons();
  cfMaybeOnboard();
}

async function startApp() {
  applyTheme();
  refreshIcons();
  renderAuthScreen();
  sb.auth.onAuthStateChange((event, session) => {
    if (event === "PASSWORD_RECOVERY") {
      authMode = "reset"; renderAuthScreen(); showAuthScreen();
    } else if (event === "SIGNED_IN" || event === "INITIAL_SESSION") {
      if (session) {
        if (authMode !== "reset") { hideAuthScreen(); bootApp(); }
      } else {
        authMode = "signin"; renderAuthScreen(); showAuthScreen();
      }
    } else if (event === "SIGNED_OUT") {
      ++cfBootSerial;
      authMode = "signin"; renderAuthScreen(); showAuthScreen();
      document.getElementById("main-content").innerHTML = "";
      TXS = []; BUDGETS = []; GOALS = []; BILLS = []; RECURRING = [];
      CLIENT_WORK = []; dhootWork = []; dhootRates = []; dhootClock = null; dhootWorkError = ""; clientLedgerError = ""; cf21LoadWarnings=[]; _cachedUserId = null;
      cfOnboardingDraft=null;cfOnboardingPromptedUser=null;document.getElementById("cf-onboard-layer").classList.remove("open");
      CHAT_MSGS = [{role:'assistant',html:'Welcome to CashFlow. Sign in to view your private chat history.'}];
    }
  });
}

function init() { startApp(); }
init();
</script>
<template id="dhoot-db-sql">-- DHOOT V29: Finance + Client + Work additive setup
-- Project: ckkkosysrfllnppjmldd. Back up before running.
-- CREATE IF NOT EXISTS does not change existing data or fix incompatible existing schemas.
-- Do not run Fire &amp; Ice RESET scripts.
BEGIN;
CREATE EXTENSION IF NOT EXISTS pgcrypto;

CREATE TABLE IF NOT EXISTS public.transactions (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 type text NOT NULL CHECK(type IN ('income','expense')), amount numeric(14,2) NOT NULL CHECK(amount&gt;0), currency text NOT NULL DEFAULT 'USD', category text NOT NULL,
 description text DEFAULT '', notes text DEFAULT '', date timestamptz NOT NULL DEFAULT now(), is_recurring boolean NOT NULL DEFAULT false,
 recurring_id uuid, person_id uuid, payment_method text, created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.budgets (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 category text NOT NULL, amount numeric(14,2) NOT NULL CHECK(amount&gt;=0), month text NOT NULL, created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.goals (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 name text NOT NULL, target_amount numeric(14,2) NOT NULL CHECK(target_amount&gt;0), current_amount numeric(14,2) NOT NULL DEFAULT 0,
 deadline date, color text DEFAULT '#818cf8', created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.bills (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 name text NOT NULL, amount numeric(14,2) NOT NULL CHECK(amount&gt;0), currency text NOT NULL DEFAULT 'USD', bill_type text DEFAULT 'bill',
 category text DEFAULT 'bills', due_day integer CHECK(due_day BETWEEN 1 AND 31), frequency text DEFAULT 'monthly',
 is_paid boolean NOT NULL DEFAULT false, paid_date date, total_installments integer, completed_installments integer DEFAULT 0,
 total_loan_amount numeric(14,2), is_active boolean NOT NULL DEFAULT true, next_due date,
 created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.recurring (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 type text NOT NULL CHECK(type IN ('income','expense')), amount numeric(14,2) NOT NULL CHECK(amount&gt;0), currency text DEFAULT 'USD', category text NOT NULL,
 description text DEFAULT '', frequency text NOT NULL, start_date date NOT NULL, end_date date, next_due date, is_active boolean NOT NULL DEFAULT true,
 created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.friends (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 name text NOT NULL, email text, avatar_color text DEFAULT '#818cf8', created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.people (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 name text NOT NULL, expected_amount numeric(14,2), frequency text, start_date date, notes text DEFAULT '',
 active boolean NOT NULL DEFAULT true, created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.expense_splits (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), paid_by uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 transaction_id uuid REFERENCES public.transactions(id) ON DELETE CASCADE, bill_id uuid REFERENCES public.bills(id) ON DELETE CASCADE,
 split_type text NOT NULL DEFAULT 'equal', total_amount numeric(14,2) NOT NULL CHECK(total_amount&gt;=0),
 created_at timestamptz NOT NULL DEFAULT now(), CONSTRAINT dhoot_split_one_subject CHECK ((transaction_id IS NOT NULL) &lt;&gt; (bill_id IS NOT NULL))
);
CREATE TABLE IF NOT EXISTS public.split_participants (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), split_id uuid NOT NULL REFERENCES public.expense_splits(id) ON DELETE CASCADE,
 friend_id uuid REFERENCES public.friends(id) ON DELETE SET NULL, is_payer boolean DEFAULT false, display_name text NOT NULL DEFAULT '',
 amount_owed numeric(14,2) NOT NULL DEFAULT 0, status text NOT NULL DEFAULT 'pending', settled_at timestamptz,
 created_at timestamptz NOT NULL DEFAULT now()
);
CREATE TABLE IF NOT EXISTS public.client_work_entries (
 id uuid PRIMARY KEY DEFAULT gen_random_uuid(), user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
 person_id text NOT NULL, work_date date NOT NULL, amount numeric(14,2) NOT NULL CHECK(amount&gt;0),
 notes text NOT NULL DEFAULT '', created_at timestamptz NOT NULL DEFAULT now()
);

-- Enable tenant isolation on every finance table; RLS is mandatory with publishable keys.
DO $$ DECLARE tab text; BEGIN
 FOR tab IN SELECT unnest(ARRAY['transactions','budgets','goals','bills','recurring','friends','people','client_work_entries']) LOOP
  EXECUTE format('ALTER TABLE public.%I ENABLE ROW LEVEL SECURITY',tab);
  IF NOT EXISTS(SELECT 1 FROM pg_policies WHERE schemaname='public' AND tablename=tab AND policyname='dhoot_owner_all') THEN
   EXECUTE format('CREATE POLICY dhoot_owner_all ON public.%I FOR ALL TO authenticated USING (user_id = (SELECT auth.uid())) WITH CHECK (user_id = (SELECT auth.uid()))',tab);
  END IF;
  EXECUTE format('REVOKE ALL ON public.%I FROM anon',tab);
  EXECUTE format('GRANT SELECT,INSERT,UPDATE,DELETE ON public.%I TO authenticated',tab);
 END LOOP;
END $$;
ALTER TABLE public.expense_splits ENABLE ROW LEVEL SECURITY;
ALTER TABLE public.split_participants ENABLE ROW LEVEL SECURITY;
DROP POLICY IF EXISTS dhoot_split_owner ON public.expense_splits;
CREATE POLICY dhoot_split_owner ON public.expense_splits FOR ALL TO authenticated
 USING (paid_by = (SELECT auth.uid())) WITH CHECK (paid_by = (SELECT auth.uid()) AND (
  (transaction_id IS NOT NULL AND EXISTS(SELECT 1 FROM public.transactions t WHERE t.id=transaction_id AND t.user_id=(SELECT auth.uid()))) OR
  (bill_id IS NOT NULL AND EXISTS(SELECT 1 FROM public.bills b WHERE b.id=bill_id AND b.user_id=(SELECT auth.uid())))
 ));
DROP POLICY IF EXISTS dhoot_participant_owner ON public.split_participants;
CREATE POLICY dhoot_participant_owner ON public.split_participants FOR ALL TO authenticated
 USING (EXISTS (SELECT 1 FROM public.expense_splits s WHERE s.id=split_id AND s.paid_by=(SELECT auth.uid())))
 WITH CHECK (EXISTS (SELECT 1 FROM public.expense_splits s WHERE s.id=split_id AND s.paid_by=(SELECT auth.uid()))
 AND (friend_id IS NULL OR EXISTS(SELECT 1 FROM public.friends f WHERE f.id=friend_id AND f.user_id=(SELECT auth.uid()))));
REVOKE ALL ON public.expense_splits,public.split_participants FROM anon;
GRANT SELECT,INSERT,UPDATE,DELETE ON public.expense_splits,public.split_participants TO authenticated;
CREATE INDEX IF NOT EXISTS dhoot_tx_user_date ON public.transactions(user_id,date DESC);
CREATE INDEX IF NOT EXISTS dhoot_cwe_user_date ON public.client_work_entries(user_id,work_date DESC);
CREATE INDEX IF NOT EXISTS dhoot_splits_payer ON public.expense_splits(paid_by);
CREATE INDEX IF NOT EXISTS dhoot_parts_split ON public.split_participants(split_id);
COMMIT;
NOTIFY pgrst, 'reload schema';

-- CashFlow work tracking: additive tables, RLS and clock RPC.
-- Do not run database reset scripts or migrate by swapping API keys.
begin;
create table if not exists public.dhoot_work_rates(
 id uuid primary key default gen_random_uuid(), user_id uuid not null references auth.users(id) on delete cascade,
 effective_date date not null, hourly_rate numeric(10,2) not null check(hourly_rate&gt;=0 and hourly_rate&lt;=10000),
 created_at timestamptz not null default now());
create index if not exists dhoot_work_rates_user_date on public.dhoot_work_rates(user_id,effective_date desc);

 id uuid primary key default gen_random_uuid(),user_id uuid not null references auth.users(id) on delete cascade,
 work_date date not null,start_time time not null,end_time time not null,
 break_minutes integer not null default 0 check(break_minutes between 0 and 1439),
 paid_hours numeric(7,2) not null check(paid_hours&gt;0 and paid_hours&lt;=24),
 created_at timestamptz not null default now());
create index if not exists dhoot_work_shifts_user_date on public.dhoot_work_shifts(user_id,work_date desc);

 break_seconds integer not null default 0,status text not null default 'working' check(status in ('working','break','completed')),
 created_at timestamptz not null default now());

-- Enforce RLS. Never allow client to change clock timestamps.
alter table public.dhoot_work_rates enable row level security;
alter table public.dhoot_work_shifts enable row level security;
alter table public.dhoot_work_clock enable row level security;
drop policy if exists dhoot_rates_own_read on public.dhoot_work_rates;
create policy dhoot_rates_own_read on public.dhoot_work_rates for select to authenticated using(user_id=(select auth.uid()));
drop policy if exists dhoot_rates_own_insert on public.dhoot_work_rates;
create policy dhoot_rates_own_insert on public.dhoot_work_rates for insert to authenticated with check(user_id=(select auth.uid()));
drop policy if exists dhoot_shifts_own_read on public.dhoot_work_shifts;
create policy dhoot_shifts_own_read on public.dhoot_work_shifts for select to authenticated using(user_id=(select auth.uid()));
drop policy if exists dhoot_shifts_own_insert on public.dhoot_work_shifts;
create policy dhoot_shifts_own_insert on public.dhoot_work_shifts for insert to authenticated with check(user_id=(select auth.uid()));
drop policy if exists dhoot_shifts_own_delete on public.dhoot_work_shifts;
create policy dhoot_shifts_own_delete on public.dhoot_work_shifts for delete to authenticated using(user_id=(select auth.uid()));
drop policy if exists dhoot_clock_own_read on public.dhoot_work_clock;
create policy dhoot_clock_own_read on public.dhoot_work_clock for select to authenticated using(user_id=(select auth.uid()));
revoke all on public.dhoot_work_rates,public.dhoot_work_shifts,public.dhoot_work_clock from anon,authenticated;
grant select,insert on public.dhoot_work_rates to authenticated;
grant select,insert,delete on public.dhoot_work_shifts to authenticated;
grant select on public.dhoot_work_clock to authenticated;
create or replace function public.dhoot_clock_action(p_action text) returns jsonb
language plpgsql security definer set search_path='' as $$
declare uid uuid:=auth.uid(); row_now timestamptz:=clock_timestamp(); s public.dhoot_work_clock%rowtype;
sec numeric; ph numeric; local_start timestamp; local_end timestamp;
begin
 if uid is null then raise exception 'Sign in required';end if;
 perform pg_advisory_xact_lock(hashtextextended(uid::text,0));
 select * into s from public.dhoot_work_clock where user_id=uid and ended_at is null for update;
 if p_action='in' then
   if s.id is not null then raise exception 'Already clocked in'; end if;
   insert into public.dhoot_work_clock(user_id,started_at,status) values(uid,row_now,'working') returning * into s;
 elsif p_action='break_start' then
   if s.id is null or s.status&lt;&gt;'working' then raise exception 'Not working';end if;
   update public.dhoot_work_clock set status='break',break_started_at=row_now where id=s.id returning * into s;
 elsif p_action='break_end' then
   if s.id is null or s.status&lt;&gt;'break' then raise exception 'No open break';end if;
   update public.dhoot_work_clock set status='working',break_seconds=break_seconds+greatest(0,floor(extract(epoch from row_now-break_started_at))::integer),break_started_at=null where id=s.id returning * into s;
 elsif p_action='out' then
   if s.id is null or s.status&lt;&gt;'working' then raise exception 'Not working or break is still open';end if;
   sec=extract(epoch from row_now-s.started_at)-s.break_seconds;
   ph=round(sec/3600,2);
   if ph&lt;=0 or ph&gt;24 then raise exception 'Out-of-range shift: contact administrator for correction';end if;
   -- Work date uses Pacific time for the original business. Adapt in a planned timezone upgrade.
   local_start=s.started_at at time zone 'America/Los_Angeles';
   local_end=row_now at time zone 'America/Los_Angeles';
   insert into public.dhoot_work_shifts(user_id,work_date,start_time,end_time,break_minutes,paid_hours)
      values(uid,local_start::date,local_start::time,local_end::time,round(s.break_seconds/60.0)::integer,ph);
   update public.dhoot_work_clock set status='completed',ended_at=row_now where id=s.id returning * into s;
 else raise exception 'Invalid action';end if;
 return jsonb_build_object('status',s.status,'id',s.id,'started_at',s.started_at,'ended_at',s.ended_at);
end;$$;
revoke all on function public.dhoot_clock_action(text) from public,anon;
grant execute on function public.dhoot_clock_action(text) to authenticated;
commit;
notify pgrst,'reload schema';
