<script id="dhoot-work-core">
// One account, one Supabase project, one navigation. Work earnings are estimates,
// NOT received income. Existing financial tables and records are untouched.
let dhootWork=[], dhootRates=[], dhootClock=null, dhootWorkError='', dhootWorkBusy=false;
const dhootEsc = esc;
const dhootNum=x=>Number(x)||0;
const dhootMoney=x=>fmt(dhootNum(x),'USD');
const dhootToday=()=>dayStr();
// The first configured hourly rate is the baseline for existing earlier shifts.
// Later changes continue to respect their effective dates. Avoid presenting
// unpriced hours as $0.00 when no rate has actually been configured.
const dhootRateAt=dt=>{
 const rates=[...dhootRates].filter(r=>r.effective_date && Number.isFinite(Number(r.hourly_rate)))
  .sort((a,b)=>String(a.effective_date).localeCompare(String(b.effective_date))||String(a.created_at||'').localeCompare(String(b.created_at||'')));
 if(!rates.length)return 0;
 const applicable=rates.filter(r=>String(r.effective_date)<=String(dt));
 return dhootNum((applicable.length?applicable[applicable.length-1]:rates[0]).hourly_rate);
};
// Straight-time estimates only: every paid hour uses the effective hourly rate.
// Overtime premiums are deliberately not calculated in this version.
function dhootBreakdown(){
 const out=new Map();
 for(const r of dhootWork){const h=dhootNum(r.paid_hours),rate=dhootRateAt(r.work_date);out.set(r.id,{h,rate,gross:h*rate});}
 return out;
}
async function dhootLoadWork(){
 dhootWorkError='';
 const [shift,rate,clock]=await Promise.all([
  sb.from('dhoot_work_shifts').select('*').order('work_date',{ascending:false}),
  sb.from('dhoot_work_rates').select('*').order('effective_date',{ascending:false}),
  sb.from('dhoot_work_clock').select('*').is('ended_at',null).limit(1).maybeSingle()
 ]);
 const errors=[shift,rate,clock].filter(x=>x.error).map(x=>x.error.message);
 if(errors.length)dhootWorkError='Work setup required: '+errors.join(' · ');
 dhootWork=shift.data||[];dhootRates=rate.data||[];dhootClock=clock.data||null;
}
function dhootWorkTotals(month=monthStr(new Date())){
 const calc=dhootBreakdown(),current=dhootWork.filter(x=>x.work_date.slice(0,7)===month);
 return {count:current.length,hours:current.reduce((n,x)=>n+dhootNum(x.paid_hours),0),earned:current.reduce((n,x)=>n+(calc.get(x.id)?.gross||0),0)};
}
function dhootOverview(){
 if(dhootWorkError)return `<section class="dhoot-overview"><div class="label">Work & payroll</div><p class="body-sm" style="margin-top:7px">Work tracking setup is not complete. Open <button style="text-decoration:underline;color:var(--blue)" onclick="switchTab('work')">Work</button> for instructions. Your financial records are unaffected.</p></section>`;
 const t=dhootWorkTotals();return `<section class="dhoot-overview"><div class="label">WORK EARNINGS · ${dhootEsc(monthStr(new Date()))}</div><div class="dhoot-mini"><div><span class="caption">Estimated gross pay</span><strong>${dhootMoney(t.earned)}</strong></div><div><span class="caption">Paid hours</span><strong>${t.hours.toFixed(2)} h</strong></div><div><span class="caption">Recorded shifts</span><strong>${t.count}</strong></div></div><p class="dhoot-help">Work earnings are not added to received income. Record payments separately to avoid double-counting.</p><button class="pill active" onclick="switchTab('work')" style="margin-top:10px">Manage shifts →</button></section>`;
}
function dhootWorkView(){
 const t=dhootWorkTotals(),calc=dhootBreakdown(),active=dhootClock,working=active?.status==='working',onBreak=active?.status==='break';
 return `<section class="dhoot-work-wrap"><div class="dhoot-top"><div><div class="label">WORKSPACE / PAYROLL</div><h1 class="heading-xl" style="margin-top:7px">Work & Earnings</h1><p class="body-sm" style="margin-top:7px">One account for shifts, payroll estimates, clients, and finance.</p></div></div>
 ${dhootWorkError?`<div class="dhoot-error" role="alert"><b>Finish one-time database setup</b><p style="margin-top:5px">${dhootEsc(dhootWorkError)}</p><p style="margin-top:6px">Click <b>Copy complete database setup SQL</b> below, then paste and run it in your <b>existing Supabase project</b> SQL Editor. Do not run any older Fire & Ice full reset SQL.</p><button class="dhoot-btn primary" onclick="dhootCopySQL()" style="margin-top:10px">Copy complete setup SQL</button><textarea id="dhoot-sql-view" class="input" style="margin-top:8px;min-height:100px;display:none" readonly></textarea></div>`:''}
 <div class="dhoot-pc-summary">${dhootPayPeriodCard(1)}${dhootPayPeriodCard(2)}</div>
 <div class="dhoot-stats"><div class="card-flat dhoot-stat"><small>Gross earnings · this month</small><strong>${dhootMoney(t.earned)}</strong></div><div class="card-flat dhoot-stat"><small>Paid hours · this month</small><strong>${t.hours.toFixed(2)} h</strong></div><div class="card-flat dhoot-stat"><small>Recorded shifts · this month</small><strong>${t.count}</strong></div></div>
 <div class="dhoot-layout"><section class="card-flat dhoot-panel"><h3>Live time clock</h3><p class="body-sm">${active? (onBreak?'On break': 'Shift in progress'):'Not clocked in'}${active?' · Started '+dhootEsc(new Date(active.started_at).toLocaleString()):''}</p><div class="dhoot-actions"><button class="dhoot-btn primary" onclick="dhootClockAction('in')" ${active||dhootWorkBusy||dhootWorkError?'disabled':''}>Clock in</button><button class="dhoot-btn" onclick="dhootClockAction('out')" ${!working||dhootWorkBusy||dhootWorkError?'disabled':''}>Clock out</button><button class="dhoot-btn" onclick="dhootClockAction('break_start')" ${!working||dhootWorkBusy||dhootWorkError?'disabled':''}>Start break</button><button class="dhoot-btn" onclick="dhootClockAction('break_end')" ${!onBreak||dhootWorkBusy||dhootWorkError?'disabled':''}>End break</button></div><p class="dhoot-help">Server records clock timestamps. A shift over 24 hours needs administrator review. End a break before clocking out.</p></section>
 <section class="card-flat dhoot-panel"><h3>Hourly rate</h3><p class="body-sm">Current estimate: <b>${dhootMoney(dhootRateAt(dhootToday()))}/hr</b></p><form onsubmit="dhootSaveRate(event)"><div class="dhoot-field"><label>Rate ($ per hour)</label><input class="input" type="number" name="rate" min="0" max="10000" step="0.01" required></div><div class="dhoot-field"><label>Effective date</label><input class="input" type="date" name="date" value="${dhootToday()}" required></div><button class="dhoot-btn primary" style="width:100%" ${dhootWorkError?'disabled':''}>Save rate</button></form><p class="dhoot-help">Historical shifts use the applicable effective-dated rate.</p></section></div>
 <section class="card-flat dhoot-panel"><h3>Manual shift entry</h3><form onsubmit="dhootSaveShift(event)"><div class="dhoot-layout"><div class="dhoot-field"><label>Shift date</label><input class="input" type="date" name="date" value="${dhootToday()}" required></div><div class="dhoot-field"><label>Unpaid break (minutes)</label><input class="input" type="number" name="break" value="0" min="0" max="1439" required></div><div class="dhoot-field"><label>Start</label><input class="input" type="time" name="start" value="09:00" required></div><div class="dhoot-field"><label>End</label><input class="input" type="time" name="end" value="17:00" required></div></div><button class="dhoot-btn primary" style="width:100%;margin-top:10px" ${dhootWorkError?'disabled':''}>Save shift</button></form><p class="dhoot-help">Straight-time estimate only: paid hours × applicable hourly rate. Unpaid breaks are excluded. Overtime premiums are not calculated; actual payroll may differ.</p></section>

 <section class="card-flat dhoot-panel"><h3>Shift history</h3>${dhootWork.length?dhootWork.map(s=>{const b=calc.get(s.id)||{h:0,gross:0,rate:0};return `<div class="dhoot-record"><div><strong style="font-size:13px">${dhootEsc(s.work_date)}</strong><p class="caption" style="margin-top:4px">${dhootEsc(s.start_time.slice(0,5))}–${dhootEsc(s.end_time.slice(0,5))} · ${b.h.toFixed(2)}h</p></div><div style="text-align:right"><strong style="font-size:13px">${dhootMoney(b.gross)}</strong><button class="pill" style="font-size:10px;color:var(--red)" onclick="dhootDeleteShift('${dhootEsc(s.id)}')">Delete</button></div></div>`}).join(''):'<div class="empty-state" style="padding:26px"><p class="body-sm">No shifts recorded yet.</p></div>'}</section>
 </section>`;
}
function dhootHours(a,b,breaks){const parts=s=>s.split(':').map(Number);const [ah,am]=parts(a),[bh,bm]=parts(b);if([ah,am,bh,bm].some(n=>!Number.isFinite(n)))return 0;let mins=bh*60+bm-ah*60-am;if(mins<=0)mins+=1440;return (mins-breaks)/60;}
// Validate shifts before saving. End times earlier than the start refer to the next day.
function cfShiftDetails(form){
 const f=new FormData(form),date=String(f.get('date')||''),start=String(f.get('start')||''),end=String(f.get('end')||''),breaks=Number(f.get('break'));
 if(!/^\d{4}-(0[1-9]|1[0-2])-([0-2]\d|3[01])$/.test(date)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(start)||!/^([01]\d|2[0-3]):[0-5]\d$/.test(end))return {error:'Enter a valid shift date, start time and end time.'};
 if(!Number.isInteger(breaks)||breaks<0)return {error:'Break must be a whole number of minutes, zero or greater.'};
 if(start===end)return {error:'Start and end times are the same. For a 24-hour shift, split it into two records.'};
 const duration=dhootHours(start,end,0)*60;
 if(breaks>=duration)return {error:'Unpaid break must be shorter than the shift duration.'};
 const hours=(duration-breaks)/60;
 if(hours<=0||hours>24)return {error:'Paid hours must be greater than zero and no more than 24.'};
 const startStamp=new Date(date+'T'+start+':00').getTime();
 const endStamp=startStamp+duration*60000;
 return {date,start,end,breaks,hours:Math.round(hours*100)/100,startStamp,endStamp,overnight:end<start};
}
function cfShiftPreview(form){
 const el=form.querySelector('[data-cf-shift-preview]');if(!el)return;
 const v=cfShiftDetails(form);
 if(v.error){el.textContent=v.error;el.style.color='var(--red)';return;}
 const rate=dhootRateAt(v.date);
 el.textContent=`${v.hours.toFixed(2)} paid hours${v.overnight?' · Ends next day':''} · Estimated pay ${dhootMoney(v.hours*rate)}${rate<=0?' (set an hourly rate)':''}`;
 el.style.color='var(--text-2)';
}
async function dhootSaveShift(e){
 e.preventDefault();
 const form=e.currentTarget;
 if(dhootWorkBusy){return;}
 const v=cfShiftDetails(form);
 const status=form.querySelector('[data-cf-shift-status]');
 const button=form.querySelector('button[type="submit"]');
 const report=(message,isError=false)=>{
  if(status){status.textContent=message;status.style.color=isError?'var(--red)':'var(--green)';}
  else alert(message);
 };
 if(v.error){report(v.error,true);return;}
 if(!navigator.onLine){report('You appear to be offline. Reconnect before saving. The shift has not been submitted.',true);return;}
 const duplicates=dhootWork.some(s=>String(s.work_date)===v.date&&String(s.start_time).slice(0,5)===v.start&&String(s.end_time).slice(0,5)===v.end);
 if(duplicates){report('This shift is already saved. Use Edit in Shift History to change it.',true);return;}
 const overlaps=dhootWork.some(s=>{
  const start=new Date(String(s.work_date)+'T'+String(s.start_time).slice(0,5)+':00').getTime();
  const duration=dhootHours(String(s.start_time).slice(0,5),String(s.end_time).slice(0,5),0)*60000;
  return Number.isFinite(start)&&duration>0&&v.startStamp<start+duration&&v.endStamp>start;
 });
 if(overlaps&&!confirm('This shift overlaps an existing shift. Save anyway?'))return;
 dhootWorkBusy=true;
 if(button){button.disabled=true;button.textContent='Saving to Supabase…';}
 report('Saving shift to Supabase…');
 try{
  // Do not combine INSERT with .select().single(): a read policy or a
  // missing return row must not make a successful INSERT look like a failure.
  const userId=await getUserId();
  if(!userId)throw new Error('Your session expired. Sign out and sign back in, then submit again.');
  const payload={user_id:userId,work_date:v.date,start_time:v.start,end_time:v.end,break_minutes:v.breaks,paid_hours:v.hours};
  const {error:saveError}=await sb.from('dhoot_work_shifts').insert(payload);
  if(saveError)throw saveError;
  // INSERT succeeded. Immediately fetch persisted rows for authoritative IDs.
  // If loading fails, keep the saved state visible and do not re-insert.
  let synced=false;
  try{
   const {data,error:fetchError}=await sb.from('dhoot_work_shifts').select('*').order('work_date',{ascending:false});
   if(fetchError)throw fetchError;
   if(!Array.isArray(data))throw Error('No shift list returned');
   dhootWork=data;
   synced=true;
  }catch(loadError){
   console.warn('Shift inserted successfully but read-back failed:',loadError);
   // Avoid fabricating a database ID. The record is saved but must be
   // reloaded when read permissions or connectivity are restored.
  }
  if(typeof d40RevealSavedShift==='function')d40RevealSavedShift(v.date.slice(0,7));
  else renderMain();
  const msg=synced
    ?`Shift saved to Supabase: ${v.date} · ${v.hours.toFixed(2)} hours · ${dhootMoney(v.hours*dhootRateAt(v.date))}.`
    :'Shift saved to Supabase, but the list could not be refreshed. Use Reload Shifts; do not submit the same shift twice.';
  const notice=document.getElementById('cf-shift-save-notice');
  if(notice){notice.textContent=msg;notice.hidden=false;notice.style.color=synced?'var(--green)':'var(--amber)';}
  else alert(msg);
 }catch(err){
  const errorText=err?.message||'Unknown Supabase error';
  report('Shift not confirmed saved: '+errorText+'. Check your connection, sign-in and shift table INSERT policy.',true);
  console.error('CashFlow shift save failed:',err);
 }finally{
  dhootWorkBusy=false;
  if(button&&button.isConnected){button.disabled=false;button.textContent='Submit Shift';}
 }
}
async function cfReloadShifts(){
 if(dhootWorkBusy)return;
 try{
  const {data,error}=await sb.from('dhoot_work_shifts').select('*').order('work_date',{ascending:false});
  if(error)throw error;
  dhootWork=data||[];renderMain();
 }catch(err){alert('Unable to reload saved shifts: '+(err?.message||'Unknown error'));}
}

async function dhootSaveRate(e){e.preventDefault();if(dhootWorkBusy)return;const f=new FormData(e.target),rate=Number(f.get('rate')),date=String(f.get('date'));if(!Number.isFinite(rate)||rate<0||rate>10000) return alert('Enter a valid rate.');dhootWorkBusy=true;try{const {error}=await sb.from('dhoot_work_rates').insert({user_id:await getUserId(),effective_date:date,hourly_rate:rate});if(error)throw error;await dhootLoadWork();renderMain()}catch(err){alert('Could not save rate: '+err.message)}finally{dhootWorkBusy=false}}
async function dhootClockAction(action){if(dhootWorkBusy)return;dhootWorkBusy=true;try{const {data,error}=await sb.rpc('dhoot_clock_action',{p_action:action});if(error)throw error;await dhootLoadWork();renderMain();}catch(err){alert('Clock action failed: '+err.message+' — refresh before retrying to avoid duplicate actions.')}finally{dhootWorkBusy=false}}
async function dhootDeleteShift(id){if(!confirm('Delete this shift record?'))return;const {error}=await sb.from('dhoot_work_shifts').delete().eq('id',id);if(error)return alert(error.message);await dhootLoadWork();renderMain()}
function dhootPeriodBounds(month,half){
 if(!/^\d{4}-(0[1-9]|1[0-2])$/.test(month))throw Error('Choose a valid paycheck month.');
 const [y,m]=month.split('-').map(Number),last=new Date(y,m,0).getDate();
 return {from:month+'-'+(half===1?'01':'16'),to:month+'-'+(half===1?'15':String(last).padStart(2,'0'))};
}
function dhootPeriodTotals(month,half){
 const {from,to}=dhootPeriodBounds(month,half),calc=dhootBreakdown();
 const rows=dhootWork.filter(s=>s.work_date>=from&&s.work_date<=to);
 return {from,to,count:rows.length,hours:rows.reduce((a,s)=>a+dhootNum(s.paid_hours),0),gross:rows.reduce((a,s)=>a+(calc.get(s.id)?.gross||0),0)};
}
function dhootPayPeriodCard(half){
 const month=monthStr(new Date()),p=dhootPeriodTotals(month,half);
 return `<div class="card-flat dhoot-pc-card"><span class="dhoot-pc-label">PC${half} · ${half===1?'1–15':'16–End'}</span><strong>${dhootMoney(p.gross)}</strong><span class="caption">${p.hours.toFixed(2)} paid hours · ${p.count} shifts</span></div>`;
}
function dhootDownloadPayPeriod(half){
 const month=document.getElementById('dhoot-pc-month')?.value||monthStr(new Date());
 let range;try{range=dhootPeriodBounds(month,half)}catch(e){alert(e.message);return;}
 dhootExportHours(range.from,range.to,'PC'+half);
}
function dhootExportHours(periodFrom,periodTo,periodLabel){
 if(dhootWorkError){alert('Work records could not load. Resolve the database connection before downloading hours.');return;}
 const from=periodFrom||document.getElementById('dhoot-export-from')?.value||'';
 const to=periodTo||document.getElementById('dhoot-export-to')?.value||'';
 if(from&&to&&from>to){alert('The start date must be on or before the end date.');return;}
 const rows=dhootWork.filter(s=>(!from||s.work_date>=from)&&(!to||s.work_date<=to)).sort((a,b)=>a.work_date.localeCompare(b.work_date)||String(a.start_time).localeCompare(String(b.start_time)));
 if(!rows.length){alert('No saved shifts are available for the selected dates.');return;}
 const breakdown=dhootBreakdown();
 const cols=['Work date','Clock in','Clock out','Unpaid break (minutes)','Paid hours','Hourly rate (USD)','Estimated gross (USD)'];
 let totalHours=0,totalGross=0;
 const data=rows.map(s=>{const b=breakdown.get(s.id)||{h:Number(s.paid_hours)||0,rate:0,gross:0};totalHours+=b.h;totalGross+=b.gross;return [s.work_date,String(s.start_time).slice(0,5),String(s.end_time).slice(0,5),s.break_minutes, b.h.toFixed(2),b.rate.toFixed(2),b.gross.toFixed(2)]});
 const csvSafe=v=>{let text=String(v??'');if(/^[\s]*[=+@-]/.test(text))text="'"+text;return '"'+text.replace(/"/g,'""')+'"'};
 const lines=[['CashFlow - My Hours Report'],...(periodLabel?[['Pay period',periodLabel]]:[]),['Date range',from||'All dates',to||'All dates'],['Recorded shifts',String(rows.length)],['Total paid hours',totalHours.toFixed(2)],['Total estimated earnings (USD)',totalGross.toFixed(2)],[],cols,...data];
 const output='\ufeff'+lines.map(r=>r.map(csvSafe).join(',')).join('\r\n');
 const url=URL.createObjectURL(new Blob([output],{type:'text/csv;charset=utf-8'}));
 const a=document.createElement('a');a.href=url;a.download='CashFlow-My-Hours-'+(periodLabel?periodLabel+'-':'')+(from||'all')+'-to-'+(to||'all')+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);
}
function dhootExportShifts(){dhootExportHours();}
async function dhootCopySQL(){const el=document.getElementById('dhoot-sql-view');el.style.display='block';el.value=document.getElementById('dhoot-db-sql').textContent;try{await navigator.clipboard.writeText(el.value);alert('SQL copied. Run in your CashFlow Supabase SQL Editor after taking a backup. This installs finance and work tables; it does not migrate old data.')}catch{el.select()}}
</script>

<template id="dhoot-v35-sql">-- CashFlow v35 corrected upgrade (compatible with BIGINT or UUID transactions.id)
-- Preserves existing transactions, work shifts and financial records.
-- Run AFTER the CashFlow work tables have been installed.
BEGIN;
CREATE EXTENSION IF NOT EXISTS pgcrypto;
DO $dhoot$
DECLARE
  id_type text;
  receipt_type text;
BEGIN
  SELECT format_type(a.atttypid, a.atttypmod) INTO id_type
  FROM pg_attribute a
  WHERE a.attrelid = to_regclass('public.transactions')
    AND a.attname = 'id' AND a.attnum &gt; 0 AND NOT a.attisdropped;
  IF id_type IS NULL THEN
    RAISE EXCEPTION 'public.transactions(id) is missing. Install the existing CashFlow finance schema first.';
  END IF;
  IF id_type NOT IN ('bigint','uuid','integer') THEN
    RAISE EXCEPTION 'Unsupported transactions.id type: %', id_type;
  END IF;

  -- Avoid rewriting or deleting a previously created receipts table.
  IF to_regclass('public.dhoot_pay_receipts') IS NOT NULL THEN
    SELECT format_type(a.atttypid, a.atttypmod) INTO receipt_type
    FROM pg_attribute a
    WHERE a.attrelid = 'public.dhoot_pay_receipts'::regclass
      AND a.attname = 'transaction_id' AND a.attnum &gt; 0 AND NOT a.attisdropped;
    IF receipt_type IS DISTINCT FROM id_type THEN
      RAISE EXCEPTION 'Existing receipts.transaction_id is %, but transactions.id is %. Manual migration required to preserve linked payments.', receipt_type, id_type;
    END IF;
  ELSE
    EXECUTE format($create$
      CREATE TABLE public.dhoot_pay_receipts (
        id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id uuid NOT NULL REFERENCES auth.users(id) ON DELETE CASCADE,
        transaction_id %s NOT NULL REFERENCES public.transactions(id) ON DELETE CASCADE,
        pay_month text NOT NULL CHECK(pay_month ~ '^20[0-9]{2}-(0[1-9]|1[0-2])$'),
        pay_half integer NOT NULL CHECK(pay_half IN (1,2)),
        amount numeric(14,2) NOT NULL CHECK(amount &gt; 0),
        created_at timestamptz NOT NULL DEFAULT now(),
        UNIQUE(transaction_id)
      )
    $create$, id_type);
  END IF;
END
$dhoot$;
CREATE INDEX IF NOT EXISTS dhoot_receipts_user_period
  ON public.dhoot_pay_receipts(user_id,pay_month,pay_half);
ALTER TABLE public.dhoot_pay_receipts ENABLE ROW LEVEL SECURITY;
DROP POLICY IF EXISTS dhoot_pay_receipts_select ON public.dhoot_pay_receipts;
CREATE POLICY dhoot_pay_receipts_select ON public.dhoot_pay_receipts
  FOR SELECT TO authenticated USING(user_id=(SELECT auth.uid()));
DROP POLICY IF EXISTS dhoot_pay_receipts_insert ON public.dhoot_pay_receipts;
CREATE POLICY dhoot_pay_receipts_insert ON public.dhoot_pay_receipts
  FOR INSERT TO authenticated WITH CHECK (
    user_id=(SELECT auth.uid()) AND EXISTS (
      SELECT 1 FROM public.transactions t
      WHERE t.id=transaction_id AND t.user_id=(SELECT auth.uid())
        AND t.type='income' AND t.currency='USD' AND t.amount &gt;= amount
    )
  );
DROP POLICY IF EXISTS dhoot_pay_receipts_delete ON public.dhoot_pay_receipts;
CREATE POLICY dhoot_pay_receipts_delete ON public.dhoot_pay_receipts
  FOR DELETE TO authenticated USING(user_id=(SELECT auth.uid()));
-- Shift permission is applied only when the work table exists.
DO $dhoot$
BEGIN
  IF to_regclass('public.dhoot_work_shifts') IS NOT NULL THEN
    EXECUTE 'DROP POLICY IF EXISTS dhoot_work_shifts_update_self ON public.dhoot_work_shifts';
    EXECUTE 'CREATE POLICY dhoot_work_shifts_update_self ON public.dhoot_work_shifts FOR UPDATE TO authenticated USING(user_id=(SELECT auth.uid())) WITH CHECK(user_id=(SELECT auth.uid()))';
    EXECUTE 'GRANT UPDATE(work_date,start_time,end_time,break_minutes,paid_hours) ON public.dhoot_work_shifts TO authenticated';
  END IF;
END
$dhoot$;
REVOKE ALL ON public.dhoot_pay_receipts FROM anon;
GRANT SELECT,INSERT,DELETE ON public.dhoot_pay_receipts TO authenticated;
COMMIT;
NOTIFY pgrst,'reload schema';
</template>

window.d35SetMonth=function(value){if(/^20\d\d-(0[1-9]|1[0-2])$/.test(value)){selectedMonth=value;renderMain();}};
window.d35CopySQL=async function(){const sql=document.getElementById('dhoot-v35-sql').textContent;const el=document.getElementById('d35-sql-area');if(el){el.style.display='block';el.value=sql;}try{await navigator.clipboard.writeText(sql);alert('Additive upgrade SQL copied. Back up your database, then run it in Supabase SQL Editor.');}catch{if(el){el.focus();el.select();}}};
window.d35Link=async function(e){e.preventDefault();if(receiptBusy)return;const f=new FormData(e.target),tx=TXS.find(t=>String(t.id)===String(f.get('tx')));if(!tx||tx.type!=='income'||tx.currency!=='USD'||receipts.some(r=>String(r.transaction_id)===String(tx.id)))return alert('Choose an unused USD income transaction.');receiptBusy=true;try{const {error}=await sb.from('dhoot_pay_receipts').insert({user_id:await getUserId(),transaction_id:tx.id,pay_month:selectedMonth,pay_half:Number(f.get('half')),amount:Number(tx.amount)});if(error)throw error;await loadReceipts();renderMain();}catch(err){alert('Unable to link payment: '+err.message)}finally{receiptBusy=false;}};

 event.preventDefault();if(dhootWorkBusy)return;

 finally{dhootWorkBusy=false;btn.disabled=false;}
};
const baseDashboard=renderDashboard;

const baseWork=dhootWorkView;
dhootWorkView=function(){let html=baseWork();html=html.replace(/(<button class="pill"[^>]*onclick="dhootDeleteShift\(')([^']+)('\)"[^>]*>Delete<\/button>)/g,`<button class="pill" onclick="d35EditShift('$2')">Edit</button>$1`);return reconciler()+html;};
const baseTools=renderTools;
renderTools=function(){const html=baseTools();return `<section class="d35-card"><h3 class="heading-md">Pay period statements</h3><p class="d35-muted">Download your work hours by pay period, or export the reconciliation summary for a selected month.</p><div class="d35-top" style="margin-top:12px"><input class="d35-select" type="month" id="d35-tools-month" value="${clean(selectedMonth)}"><button class="d35-btn" onclick="d35ExportPeriodCSV()">Export paycheck summary (CSV)</button></div><p class="d35-muted">Additional exports for hours, transactions, PDF, and Excel remain below.</p></section>`+html;};
window.d35ExportPeriodCSV=function(){const month=document.getElementById('d35-tools-month')?.value||selectedMonth;if(!/^20\d{2}-(0[1-9]|1[0-2])$/.test(month))return alert('Select a valid month.');if(dhootWorkError||receiptError)return alert('Work or payment data is unavailable; complete setup before exporting.');const rows=[['Pay period','From','Through','Hours worked','Estimated gross USD','Linked received USD','Unpaid estimate USD']];for(let half=1;half<=2;half++){const p=dhootPeriodTotals(month,half),got=receiptPeriod(month,half);rows.push(['PC'+half,p.from,p.to,p.hours.toFixed(2),p.gross.toFixed(2),got.toFixed(2),(p.gross-got).toFixed(2)]);}const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a'),u=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.href=u;a.download=`CashFlow-Paycheck-Summary-${month}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(u),15000);};

<script id="dhoot-work-visual-v40-script">
(function(){

 window.cfGetWorkSelection=()=>({month:workMonth,half:filterHalf});
 const mny=n=>fmt(Number(n)||0,'USD');

 const monthsLabel=m=>new Date(m+'-15T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
 function goalKey(){return 'dhoot-smart-paycheck-goals-v43-'+(typeof USER!=='undefined'&&USER?.id?USER.id:'local');}
 function legacyGoalKey(){return 'dhoot-work-goals-v40-'+(typeof USER!=='undefined'&&USER?.id?USER.id:'local');}
 function goals(month){try{const store=JSON.parse(localStorage.getItem(goalKey())||'{}');const legacy=JSON.parse(localStorage.getItem(legacyGoalKey())||'{}');const g=store[month]||legacy;return [Number(g.pc1)>0?Number(g.pc1):1800,Number(g.pc2)>0?Number(g.pc2):1800];}catch{return [1800,1800];}}
 function d43Forecast(month,half,actual){
   const today=dhootToday();const nowMonth=today.slice(0,7);const lastDay=new Date(Number(month.slice(0,4)),Number(month.slice(5,7)),0).getDate();
   const start=half===1?1:16,end=half===1?15:lastDay;
   const calendarDays=end-start+1;
   if(month<nowMonth)return {amount:actual.gross,remaining:0,status:'Completed month',basis:'Actual recorded shifts only'};
   if(month>nowMonth)return {amount:0,remaining:calendarDays,status:'Future month',basis:'No shifts forecast before a month begins'};
   const day=Number(today.slice(8,10)),elapsed=Math.max(0,Math.min(end,day)-start+1),remaining=Math.max(0,end-Math.max(day,start-1));
   if(elapsed===0)return {amount:actual.gross,remaining,status:'Not started',basis:'No observed work in this period'};
   const cutoff=today;
   const past=dhootWork.filter(s=>String(s.work_date).slice(0,7)===month&&Number(String(s.work_date).slice(8,10))>=start&&Number(String(s.work_date).slice(8,10))<=Math.min(end,day)&&String(s.work_date)<=cutoff);
   const bd=dhootBreakdown();const observed=past.reduce((sum,s)=>sum+Number(bd.get(s.id)?.gross||0),0);
   const projected=observed/elapsed*calendarDays;
   const value=Math.max(actual.gross,projected);
   return {amount:value,remaining,status:remaining?'In progress':'Period complete',basis:'Run-rate from elapsed calendar days; includes recorded shifts only'};
 }
 function d43ForecastCard(half,actual,target,forecast){

 }

 window.d40SetMonth=value=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(value)){workMonth=value;renderMain();}};
 window.d40RevealSavedShift=value=>{if(/^\d{4}-(0[1-9]|1[0-2])$/.test(value))workMonth=value;filterHalf=0;renderMain();};
 window.d40Half=h=>{filterHalf=filterHalf===h?0:h;renderMain();};
 window.d40ToggleGoals=()=>document.getElementById('d40-goal-editor')?.classList.toggle('open');
 window.d40SaveGoals=event=>{event.preventDefault();const f=event.target;const a=Number(f.pc1.value),b=Number(f.pc2.value);if(!Number.isFinite(a)||!Number.isFinite(b)||a<=0||b<=0)return alert('Enter goals greater than zero.');try{const all=JSON.parse(localStorage.getItem(goalKey())||'{}');all[workMonth]={pc1:a,pc2:b};localStorage.setItem(goalKey(),JSON.stringify(all));renderMain();}catch(err){alert('Could not save goals in this browser: '+err.message);}};

 dhootWorkView=function(){

 const allMonths=[...new Set(dhootWork.map(s=>String(s.work_date).slice(0,7)))].filter(m=>/^\d{4}-\d{2}$/.test(m)).sort().reverse().slice(0,8);
 const share=earned>0?(p1.gross/earned*100):50;
 const entries=dhootWork.filter(s=>String(s.work_date).slice(0,7)===workMonth&&(!filterHalf||(filterHalf===1?Number(s.work_date.slice(8,10))<=15:Number(s.work_date.slice(8,10))>=16))).sort((a,b)=>String(b.work_date).localeCompare(String(a.work_date)));
 const breakdown=dhootBreakdown(),active=dhootClock,working=active?.status==='working',onBreak=active?.status==='break';
 return `<div class="d40-work fade-in">
 <div class="d40-head" style="margin-bottom:0"><div><div class="label">WORK / PAYROLL</div><h1 class="heading-lg" style="margin-top:5px">Work & Earnings</h1></div><label class="d40-tiny">Month <input type="month" class="input" aria-label="Payroll month" value="${safe(workMonth)}" onchange="d40SetMonth(this.value)" style="margin-top:4px;max-width:180px"></label></div>

 <div class="d40-kpis"><div class="d40-kpi"><small>Total earned</small><strong>${dhootWorkError?'Unavailable':mny(earned)}</strong></div><div class="d40-kpi"><small>Shift records</small><strong>${p1.count+p2.count}</strong><span class="d40-tiny">${hours.toFixed(2)} paid hours</span></div></div>

 <form id="d40-goal-editor" class="d40-goal-editor" onsubmit="d40SaveGoals(event)"><label>PC1 goal ($)<input class="input" type="number" name="pc1" min="1" step="0.01" value="${goal1}" required></label><label>PC2 goal ($)<input class="input" type="number" name="pc2" min="1" step="0.01" value="${goal2}" required></label><button class="d40-submit">Save goals</button></form>

<script id="dhoot-ai-v44">

(function(){
 const originalAnswer=answerFinanceQuestion;

 const categories=(m)=>{const list=Object.entries(totals(m).categories).sort((a,b)=>b[1]-a[1]);return list.length?bars(list.slice(0,8)):'No recorded USD expenses for this month.'};

 const answer=(input)=>{const q=String(input||'').toLowerCase().trim(),m=((q.match(/\b20\d{2}-(?:0[1-9]|1[0-2])\b/)||[])[0])||getMonth(),a=totals(m),intro=`<strong>${safe(monthName(m))}</strong><div style="height:10px"></div>`;

GS.map(chatBubbleHtml).join('')}</div><div style="height:175px"></div></div>`;return inner;};

  const incomeOrUnknown=n=>hasHourlyRate?money(n):'Set hourly rate';
  const dailyHTML=`<section class="cfpage-panel cf-daily-panel" id="cf-daily-earnings" aria-label="Daily earnings breakdown">
   <div class="cf-new-top cf-daily-top"><div><div class="cf-new-eyebrow">Your earnings by day</div><h2>Daily income breakdown</h2><p class="cfpage-caption">Estimated gross earnings from recorded shifts × their applicable hourly rates. Not payments received.</p></div>
   <label class="cfpage-caption">Choose month<input aria-label="Daily earnings month" class="input" type="month" value="${safe(selectedMonth)}" onchange="d40SetMonth(this.value)"></label></div>
   <div class="cf-daily-summary"><div><small>Today’s work earnings</small><strong>${ready?incomeOrUnknown(todayIncome):'Unavailable'}</strong></div><div><small>Selected period gross</small><strong>${ready?incomeOrUnknown(periodEarned):'Unavailable'}</strong></div><div><small>Days worked</small><strong>${ready?days.length:'—'}</strong></div></div>
   <div class="cf-daily-filter" aria-label="Pay period filter"><button class="${!selectedHalf?'selected':''}" onclick="d40Half(0)" type="button">All days</button><button class="${selectedHalf===1?'selected':''}" onclick="d40Half(1)" type="button">PC1 · 1–15</button><button class="${selectedHalf===2?'selected':''}" onclick="d40Half(2)" type="button">PC2 · 16–end</button></div>
   ${!ready?'<p class="cfpage-warning">Could not load work records. Check the database connection in Full work workspace.</p>':!hasHourlyRate?'<p class="cfpage-warning">Set your hourly rate under Full work workspace → Time clock & hourly rate settings to calculate your daily pay.</p>':''}
   <div class="cf-daily-rows">${days.length?days.map(d=>`<div class="cf-daily-row"><div class="cf-daily-date"><b>${safe(new Date(d.date+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}))}</b><small>${d.shifts} shift${d.shifts!==1?'s':''} · ${d.hours.toFixed(2)} paid hours</small></div><strong>${ready?incomeOrUnknown(d.gross):'—'}</strong></div>`).join(''):'<p class="cfpage-caption" style="padding:18px 0">No saved work shifts for this period. Record a shift to see your daily earnings.</p>'}</div>
   <p class="cfpage-warning">Daily earnings are before taxes and deductions, with straight-time pay only. Client work entered separately is not included in shift earnings.</p>
  </section>`;
  return `<div class="cfpage">
   <div class="cf-new-top"><div><div class="cf-new-eyebrow">Work / Earnings</div><h1 class="cf-new-title">Your work, clearly.</h1><p class="cf-new-muted">Log your shifts, review earnings and manage both monthly pay periods.</p></div><div class="cf-new-actions"><button class="cf-new-btn primary" onclick="cfGoLedger('cf-work-ledger')">${icon('plus')} Record shift</button></div></div>
   ${!ready?`<div class="cfpage-error">Work records may be unavailable. Open the detailed workspace below to view the database setup or error.</div>`:''}
   <div class="cfpage-workhero"><div><small>Estimated gross earnings · ${safe(month)}</small><strong>${ready?(hasHourlyRate?money(totals.earned):'Set hourly rate'):'Unavailable'}</strong><p>Estimated from recorded shifts and hourly rates—not money confirmed in your bank. No overtime is applied.</p></div><button onclick="cfGoLedger('cf-work-ledger')">Open work tools →</button></div>
   <div class="cfpage-kpis"><div class="cfpage-kpi"><small>Paid hours this month</small><strong>${ready?Number(totals.hours||0).toFixed(2)+' h':'—'}</strong><span>Recorded shift duration</span></div><div class="cfpage-kpi"><small>Shifts logged</small><strong>${ready?Number(totals.count||0):'—'}</strong><span>This month's shifts</span></div><div class="cfpage-kpi"><small>Current hourly rate</small><strong>${hasHourlyRate?money(rate):'Set rate'}</strong><span>Before taxes</span></div><div class="cfpage-kpi"><small>Time clock</small><strong>${current?current.status==='break'?'On break':'Active':'Off duty'}</strong><span>Current clock status</span></div></div>
   ${dailyHTML}
   <div class="cfpage-split"><section class="cfpage-panel"><h3>Recent shifts</h3><p class="cfpage-caption">Your most recently recorded shifts, across all months.</p>${logged.length?logged.map(x=>`<div class="cfpage-table-row"><div style="display:flex;align-items:center;gap:10px;min-width:0"><div class="cfpage-icon">${icon('calendar-check')}</div><div><strong>${safe(x.work_date)}</strong><small>${safe(String(x.start_time||'').slice(0,5))} – ${safe(String(x.end_time||'').slice(0,5))}</small></div></div><em>${Number(dhootBreakdown().get(x.id)?.h||0).toFixed(2)} h<br><b style="color:var(--green)">${hasHourlyRate?money(dhootBreakdown().get(x.id)?.gross||0):'Set rate'}</b></em></div>`).join(''):'<p class="cfpage-caption" style="margin-top:18px">No shifts recorded yet. Open work tools to add your first shift.</p>'}</section><section class="cfpage-panel"><h3>Work tools</h3><p class="cfpage-caption">All existing work records, pay-period forecasts and tools are kept in the detailed workspace.</p><div class="cfpage-cta"><button class="primary" onclick="cfGoLedger('cf-work-ledger')">${icon('clock-3')} Time clock & shifts</button><button onclick="cfGoLedger('cf-work-ledger')">${icon('wallet')} PC1 / PC2</button><button onclick="switchTab('tools')">${icon('download')} Exports</button></div><p class="cfpage-warning">Hourly pay and paycheck values are estimates until reconciled with actual payments.</p></section></div>
   <details class="cfpage-ledger" id="cf-work-ledger"><summary>Full work workspace — shifts, paychecks, clock and settings</summary><div>${legacy}</div></details>
  </div>`;
 };
 renderPeople=function(){
  const legacy=oldClients();
  const from=cwMonday(clientWeekOffset),to=cwSunday(clientWeekOffset);
  const work=CLIENT_WORK.filter(w=>w.work_date>=from&&w.work_date<=to);
  const paid=TXS.filter(t=>t.personId&&t.type==='income'&&t.category==='people_payment'&&t.currency==='USD'&&String(t.date).slice(0,10)>=from&&String(t.date).slice(0,10)<=to);
  const receivedAll=TXS.filter(t=>t.personId&&t.type==='income'&&t.category==='people_payment'&&t.currency==='USD');
  const earnedAll=sum(CLIENT_WORK,'amount'),received=sum(receivedAll,'amount');
  const top=PEOPLE.map(p=>({p,earned:sum(CLIENT_WORK.filter(w=>String(w.person_id)===String(p.id)),'amount'),paid:sum(receivedAll.filter(t=>String(t.personId)===String(p.id)),'amount')})).sort((a,b)=>(b.earned-b.paid)-(a.earned-a.paid)).slice(0,5);
  return `<div class="cfpage">
   <div class="cf-new-top"><div><div class="cf-new-eyebrow">Clients / Payments</div><h1 class="cf-new-title">Every dollar accounted for.</h1><p class="cf-new-muted">Log what clients owe each day and separately record the payments they actually send.</p></div><div class="cf-new-actions"><button class="cf-new-btn" onclick="openPersonForm()">${icon('user-plus')} New client</button><button class="cf-new-btn primary" onclick="cfGoLedger('cf-client-ledger')">${icon('plus')} Record earnings</button></div></div>
   ${clientLedgerError?`<div class="cfpage-error">Client work records are unavailable. Open the detailed tracker below for database setup instructions.</div>`:''}
   <div class="cfpage-kpis"><div class="cfpage-kpi"><small>Earned this week</small><strong>${clientLedgerError?'—':money(sum(work,'amount'))}</strong><span>Daily work ledger</span></div><div class="cfpage-kpi"><small>Received this week</small><strong>${money(sum(paid,'amount'))}</strong><span>Recorded payments</span></div><div class="cfpage-kpi"><small>Outstanding · all time</small><strong>${clientLedgerError?'—':money(Math.max(0,earnedAll-received))}</strong><span>Earned minus received</span></div><div class="cfpage-kpi"><small>Active clients</small><strong>${PEOPLE.filter(p=>p.active).length}</strong><span>Saved client profiles</span></div></div>
   <div class="cfpage-split"><section class="cfpage-panel"><div class="cf-new-top" style="margin-bottom:8px"><div><h3>Client balances</h3><p class="cfpage-caption">All-time earnings minus received payments.</p></div></div>${top.length?top.map(x=>`<div class="cfpage-table-row"><div style="min-width:0"><strong>${safe(x.p.name)}</strong><small>Earned ${money(x.earned)} · Paid ${money(x.paid)}</small></div><em style="color:${x.earned-x.paid>0?'var(--amber)':'var(--green)'}">${x.earned-x.paid<0?'Credit ':'Owed '}${money(Math.abs(x.earned-x.paid))}</em></div>`).join(''):'<p class="cfpage-caption" style="margin-top:18px">Add a client to start tracking daily earnings.</p>'}</section><section class="cfpage-panel"><h3>Weekly overview</h3><div class="cfpage-week"><button aria-label="Previous week" onclick="changeClientWeek(-1)" >${icon('chevron-left')}</button><span>${safe(cwDate(from))} – ${safe(cwDate(to))}</span><button aria-label="Next week" onclick="changeClientWeek(1)">${icon('chevron-right')}</button></div><div class="cfpage-table-row"><div><strong>Daily work logged</strong><small>${work.length} entries</small></div><em>${clientLedgerError?'—':money(sum(work,'amount'))}</em></div><div class="cfpage-table-row"><div><strong>Payments received</strong><small>${paid.length} transactions</small></div><em>${money(sum(paid,'amount'))}</em></div><p class="cfpage-warning">Payments can settle work from previous weeks. Weekly earned minus weekly paid is not necessarily this week's balance.</p><div class="cfpage-cta"><button class="primary" onclick="cfGoLedger('cf-client-ledger')">${icon('notebook-pen')} Work & payments</button><button onclick="openPersonForm()">${icon('user-plus')} Add client</button></div></section></div>
   <details class="cfpage-ledger" id="cf-client-ledger"><summary>Full client tracker — daily entries, payments, statements and history</summary><div>${legacy}</div></details>
  </div>`;
 };
})();
</script>

<script id="cf-reliability-helpers">
(function(){
 let toastTimer;
 window.cfNotify=function(message,isError=false){
  const box=document.getElementById('cf-toast');if(!box)return;
  box.textContent=message;box.classList.toggle('error',!!isError);box.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>box.classList.remove('show'),4200);
 };
 // Keep users informed about loss/restoration of connection. No offline save is implied.
 window.addEventListener('offline',()=>cfNotify('You are offline. New entries cannot sync until connection returns.',true));
 window.addEventListener('online',()=>cfNotify('Connection restored. You can save new entries.'));
 const wrapSave=(name,msg)=>{
  const original=window[name];if(typeof original!=='function')return;
  window[name]=async function(...args){
   const result=await original.apply(this,args);
   // Success is only assumed for explicit, returned Supabase records.
   if(result && !result.error)cfNotify(msg);
   return result;
  };
 };
 wrapSave('addTransaction','Transaction saved to CashFlow.');
 wrapSave('cf2UpdateTransaction','Transaction changes saved.');
 const originalSwitch=window.switchTab;
 if(typeof originalSwitch==='function')window.switchTab=function(tab){
  const result=originalSwitch.apply(this,arguments);
  const main=document.getElementById('main-content');
  if(main){main.setAttribute('aria-label',(document.querySelector('.nav-btn.active span')?.textContent||'CashFlow')+' page');}
  return result;
 };
})();
</script>
